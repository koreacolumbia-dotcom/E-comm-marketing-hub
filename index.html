    :root { --brand:#002d72; --bg0:#f6f8fb; --bg1:#eef3f9; }

    body{
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      font-family: 'Plus Jakarta Sans', sans-serif;
      color:#0f172a;
      min-height:100vh;

    .glass-card{
      background: rgba(255,255,255,0.60);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,45,114,0.06);
    }
    .sidebar{
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255,255,255,0.85);
    }
    .sidebar-nav-scroll{
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148,163,184,.45) transparent;
    }
    .sidebar-nav-scroll::-webkit-scrollbar{ width:6px; }
    .sidebar-nav-scroll::-webkit-scrollbar-track{ background:transparent; }
    .sidebar-nav-scroll::-webkit-scrollbar-thumb{
      background: rgba(148,163,184,.38);
      border-radius:999px;
    }
    .sidebar-nav-scroll::-webkit-scrollbar-thumb:hover{ background: rgba(100,116,139,.58); }
    .nav-item{
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      gap:12px;
      font-weight: 800;
      transition: transform .22s ease, box-shadow .22s ease, background-color .22s ease, color .22s ease;
      cursor:pointer;
      user-select:none;
      animation: sidebarRise .55s ease both;
      transform-origin: left center;
    }
    .nav-item::before{
      content:'';
      position:absolute;
      inset:0 auto 0 0;
      width:4px;
      border-radius:999px;
      background: linear-gradient(180deg, #1d4ed8, #60a5fa);
      opacity:0;
      transform: scaleY(.45);
      transition: opacity .22s ease, transform .22s ease;
    }
    .nav-item::after{
      content:'';
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(29,78,216,.10), rgba(96,165,250,0));
      opacity:0;
      transition: opacity .22s ease;
      pointer-events:none;
    }
    .nav-item.active{
      background:#ffffff;
      color: var(--brand);
      box-shadow: 0 14px 28px rgba(0,45,114,0.10);
      transform: translateX(6px);
    }
    .nav-item.active::before{
      opacity:1;
      transform: scaleY(1);
    }
    .nav-item.active::after{
      opacity:1;
    }
    .nav-item:not(.active){
      color: #94a3b8;
    }
    .nav-item:not(.active):hover{
      background: rgba(255,255,255,0.72);
      color:#334155;
      transform: translateX(4px) translateY(-1px);
      box-shadow: 0 12px 24px rgba(15,23,42,0.06);
    }
    .nav-item.content-intelligence-nav{font-size:13px;letter-spacing:-.025em;border-radius:10px;gap:10px;padding:12px 10px}
    .nav-item.content-intelligence-nav:not(.active){color:#405b72}
    .nav-item.content-intelligence-nav.active{color:#002d72;background:#eaf2f9;box-shadow:none;transform:none}
    .nav-item.content-intelligence-nav.active::before{width:3px;background:#24679c;border-radius:0}
    .nav-item.content-intelligence-nav.active::after{display:none}
    .nav-item.content-intelligence-nav:not(.active):hover{transform:none;box-shadow:none;background:#f1f5f9}
    .nav-item:hover i{
      transform: scale(1.06);
    }

    .nav-section{ margin-top: 18px; }
    .nav-section:first-child{ margin-top: 0; }
    .nav-section-title{
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #94a3b8;
      padding: 0 10px;
      margin-bottom: 10px;
    }
    .nav-divider{
      height: 1px;
      background: rgba(148,163,184,0.22);
      margin: 14px 10px;
    }
    .nav-item i{
      width: 18px;
      text-align: center;
      font-size: 14px;
      opacity: .95;
      transition: transform .22s ease;
    }

    /* ===== Mobile Bottom Tab ===== */
    .mo-tabbar{
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.85);
    }
    .mo-tab{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding: 10px 8px;
      border-radius: 16px;
      font-weight: 900;
      transition: transform .2s ease, background-color .2s ease, color .2s ease, box-shadow .2s ease;
      color:#94a3b8;
      user-select:none;
      cursor:pointer;
      white-space: nowrap;

    .mo-tab{

    }
    .mo-tabbar .overflow-x-auto{

    }
    .mo-tabbar .overflow-x-auto::-webkit-scrollbar{

    }
    .mo-tab:hover{

    }
    .mo-tab.active{

    }
    .mo-tab.active i{

    }
    .safe-bottom{
      padding-bottom: env(safe-area-inset-bottom);

    /* ===== Loading overlay (iframe) ===== */
    .loading-overlay{
      position: fixed;
      inset: 0;
      background: rgba(248,250,252,0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner{
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 4px solid rgba(0,0,0,0.10);
      border-top-color: rgba(0,45,114,0.85);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
    @keyframes sidebarRise{
      from{ opacity:0; transform: translateX(-10px) scale(.985); }
      to{ opacity:1; transform: translateX(0) scale(1); }
    }
    @keyframes activeBounce{
      0%{ transform: translateY(0) scale(1); }
      35%{ transform: translateY(-2px) scale(1.08); }
      100%{ transform: translateY(0) scale(1); }
    }
    .muted { color:#64748b; }

    /* iframe 내부 스크롤 방지 */
    #frame{ overflow:hidden; background:#fff; }
  </style>
