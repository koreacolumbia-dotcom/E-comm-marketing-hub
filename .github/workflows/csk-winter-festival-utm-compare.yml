name: CSK Winter Festival UTM Owned Comparison
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CSK Marketing Operations 3.0"]
    types: [completed]
  schedule:
    # 07:35 KST verified daily snapshot first; 11:05 KST fallback for late GA4 data.
    - cron: '35 22 * * *'
    - cron: '5 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_winter_festival_utm_owned.py'
      - 'tests/test_winter_festival_utm_owned.py'
      - '.github/workflows/csk-winter-festival-utm-compare.yml'
permissions:
  contents: write
concurrency:
  group: csk-winter-festival-utm-owned
  cancel-in-progress: false
jobs:
  attribution:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            daily_digest_session_source.py
            scripts/build_winter_festival_utm_owned.py
            tests/test_winter_festival_utm_owned.py
            reports/decision_health
            reports/marketing_operations/latest.json
            reports/daily_digest/data/daily
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm the GA4 UTM extraction contract without querying BigQuery
        run: |
          python -m unittest discover -s tests -p 'test_winter_festival_utm_owned.py' -v
          python -m py_compile scripts/build_winter_festival_utm_owned.py
      - name: Install existing canonical GA4 query dependencies
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery pandas
      - name: Compare 2025 and 2026 festival D1-D2 campaign and term under a 6 GiB dry-run limit
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/build_winter_festival_utm_owned.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/decision_health/winter_festival_utm_owned_2026.json')
          j=json.loads(p.read_text())
          assert j['schema']==1 and j['causal'] is False
          assert j['cost']['total_dry_cap']==6*1024**3
          assert j['status'] in ('ga4_measured','blocked_budget','blocked_credentials','query_error')
          if j['status']=='ga4_measured':
              assert set(j['data'])=={'2025','2026'}
              assert all(isinstance(r['utm_term'],str) for year in j['data'].values() for r in year['rows'])
          assert 'user_pseudo_id' not in str(j) and 'ga_session_id' not in str(j)
          print("WINTER FESTIVAL UTM",j['status'])
          PY
      - name: Persist only aggregated and sanitized UTM evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/decision_health/winter_festival_utm_owned_2026.json
          if git diff --cached --quiet; then echo "No UTM evidence change"; exit 0; fi
          git commit -m "Publish budget-capped Winter Festival UTM campaign-term evidence"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
