name: SMTP authentication healthcheck
# Owner-only retest after Adwords and CRM join corrections.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smtp-auth-healthcheck.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: owner-crm-digest-test
      cancel-in-progress: true
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check TLS and authentication without sending mail
        shell: bash
        run: |
          python - <<'PY'
          import os, ssl, smtplib
          host, user, password = (os.getenv(k, '').strip() for k in ('SMTP_HOST','SMTP_USER','SMTP_PASS'))
          if not all((host,user,password)):
              raise SystemExit('Missing SMTP configuration')
          if user.lower() != 'koreacolumbia@gmail.com':
              raise SystemExit('SMTP_USER does not match intended sender; update repository secret')
          if host.lower() == 'smtp.gmail.com':
              password = ''.join(password.split())
          port = int(os.getenv('SMTP_PORT') or '587')
          ports = list(dict.fromkeys([port,465,587])) if host.lower() == 'smtp.gmail.com' else [port]
          for p in ports:
              phase = 'connect'
              try:
                  ctx = ssl.create_default_context()
                  smtp = smtplib.SMTP_SSL(host,p,timeout=25,context=ctx) if p == 465 else smtplib.SMTP(host,p,timeout=25)
                  with smtp:
                      phase = 'tls'
                      smtp.ehlo()
                      if p != 465:
                          smtp.starttls(context=ctx)
                          smtp.ehlo()
                      phase = 'auth'
                      smtp.login(user,password)
                      print(f'[SMTP] AUTH OK port={p}; no email submitted',flush=True)
                      break
              except smtplib.SMTPAuthenticationError as e:
                  print(f'[SMTP] rejected credential code={e.smtp_code}; port={p}',flush=True)
              except Exception as e:
                  print(f'[SMTP] phase={phase} port={p} error={type(e).__name__}',flush=True)
          else:
              raise SystemExit('SMTP authentication failed; check provider credentials and policy')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild report with verified CRM buyer data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          DAILY_DIGEST_ADMIN_BQ_PROJECT: columbia-ga4
          DAILY_DIGEST_ADMIN_BQ_LOCATION: asia-northeast3
          DAILY_DIGEST_REPORT_MODE: daily
          DAILY_DIGEST_SKIP_IF_EXISTS: 'false'
          DAILY_DIGEST_USE_DATA_CACHE: 'false'
          DAILY_DIGEST_WRITE_DATA_CACHE: 'true'
          DAILY_DIGEST_END_DATE_OVERRIDE: '2026-11-17'
          DAILY_DIGEST_SKIP_HUB_WRITE: 'true'
          REQUIRE_CRM_BUYERS: '1'
          GA4_START_DATE: '2026-11-17'
          GA4_END_DATE: '2026-11-17'
          YMD: '2026-11-17'
        run: |
          set -euo pipefail
          echo "$GOOGLE_SA_JSON_B64" | base64 -d > /tmp/ga_sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ga_sa.json
          python -m py_compile daily_digest_live_final.py daily_digest_session_source.py
          python -u daily_digest_live_final.py --out-dir reports/daily_digest
          python -u scripts/render_daily_png.py reports/daily_digest/daily/2026-11-17.html reports/daily_digest/daily/2026-11-17.png
          python - <<'PY'
          import json
          d=json.load(open('reports/daily_digest/data/daily/2026-11-17.json'))
          assert d['end_date']=='2026-11-17'
          rows=d['channel_snapshot']
          assert rows and all(r.get('new_buyers') is not None and r.get('existing_buyers') is not None for r in rows)
          print('[OK] CRM buyer counts available')
          PY
      - name: Send original CID PNG to report owner only after successful authentication
        env:
          DAILY_RECIPIENTS: hugh.kang@columbia.com
          DAILY_DIGEST_TEST_RECIPIENT: hugh.kang@columbia.com
          REPORT_DATE: '2026-11-17'
          REPORT_MODE: daily
          MODE_DAILY_ONLY: 'true'
          HUB_URL: https://koreacolumbia-dotcom.github.io/E-comm-marketing-hub
        run: python scripts/send_daily_email.py
