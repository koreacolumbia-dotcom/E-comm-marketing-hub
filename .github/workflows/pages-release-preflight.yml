name: Pages Release Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/csk-unified-hub.js"
      - "tests/test_unified_hub.py"
      - "scripts/prepare_cloudflare_bundle.py"
      - "assets/dashboard-redesign.js"
      - "assets/mobile-edge-to-edge.js"
      - "assets/mobile-edge-to-edge.css"
      - "scripts/patch_owned_pdp_yoy.py"
      - "scripts/pdp_yoy_guard.py"
      - "tests/test_pdp_yoy_guard.py"
      - "tests/test_mobile_dashboard.py"
      - "reports/decision_health/index.html"
      - "reports/decision_health/diagnosis.js"
      - "scripts/build_problem_diagnosis.py"
      - "tests/test_problem_diagnosis.py"
      - "scripts/patch_owned_pdp_yoy.py"
      - "scripts/dashboard_security.py"
      - ".github/workflows/reports_build.yml"
      - "reports/decision_health/timeline.js"
      - "reports/member_funnel/index.html"
      - "reports/voc_crema/member_funnel/index.html"
      - ".github/workflows/pages-release-preflight.yml"
  schedule:
    # Validate a fixed integration snapshot once an hour, not on every push.
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-release-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable integration snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dashboard navigation and promotion data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path(".").resolve()
          index=Path("index.html").read_text(encoding="utf-8")
          menu=Path("assets/csk-unified-hub.js").read_text(encoding="utf-8")
          assert 'src="assets/csk-unified-hub.js' in index, "Unified app script not linked"
          routes=re.findall(r'^\s*\["([a-z0-9_]+)","[^"]+","([^"]+)","fa-[^"]+"\]',menu,re.M)
          assert len(routes)>=20, f"Unified navigation incomplete: {len(routes)} routes"
          keys=[key for key,_ in routes]
          assert len(keys)==len(set(keys)), "Duplicate route keys"
          targets=sorted(set(target for _,target in routes))
          assert any("decision_health/index.html" in x for x in targets), "Decision center navigation missing"
          assert all("reports/voc_blog/index.html" not in x for x in targets), "Unbuilt blog VOC navigation must not be published"
          for target in targets:
              rel=target.split("#",1)[0].split("?",1)[0]
              if re.match(r"^[a-z]+://",rel,re.I): continue
              p=(root/rel).resolve()
              assert p.is_relative_to(root) and p.is_file(), f"Missing or unsafe target: {rel}"
          folder=Path("reports/competitor_sale_calendar")
          cal=json.loads((folder/"latest.json").read_text(encoding="utf-8"))
          assert cal["schema_version"]==1 and cal["events"]
          for e in cal["events"]:
              if e["kind"] in {"observed_banner","verified_start"}:
                  assert e.get("end_date") is None, e["id"]
              if e["kind"]=="verified_period":
                  assert e["start_date"]<=e["end_date"], e["id"]
          q=json.loads(Path("reports/competitor_intelligence/latest-quality.json").read_text(encoding="utf-8"))
          rows=q.get("brands",[])
          assert q["denominator"]==len({r["brand"] for r in rows}), "Competitor denominator mismatch"
          assert q["accessible_brands"]==sum(r.get("pages",0)>0 for r in rows), "Incorrect access count"
          b=json.loads(Path("reports/competitor_intelligence/reviewed-market-baseline.json").read_text(encoding="utf-8"))
          assert len({r["brand"] for r in b["memberships"]})==len(b["memberships"]), "Duplicate benefit brand"
          page=(folder/"index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",page,re.I)
          assert scripts, "No scripts in calendar"
          Path("/tmp/csk-calendar-release-check.js").write_text("\n".join(scripts),encoding="utf-8")
          print("Navigation, calendar and CRM schema checks passed.")
          PY
          node --check /tmp/csk-calendar-release-check.js
          node --check assets/csk-unified-hub.js
          node --check assets/mobile-edge-to-edge.js
          python -m unittest discover -s tests -p 'test_unified_hub.py' -v
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path("reports/decision_health/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",src,re.I)
          assert scripts, "No decision health script"
          Path("/tmp/csk-decision-center.js").write_text("\n".join(scripts),encoding="utf-8")
          assert "source" in src.lower() or "원천" in src
          PY
          node --check /tmp/csk-decision-center.js
          node --check reports/decision_health/timeline.js
          node --check reports/decision_health/diagnosis.js
          python -m py_compile scripts/build_problem_diagnosis.py
          python -m py_compile scripts/patch_owned_pdp_yoy.py scripts/pdp_yoy_guard.py scripts/dashboard_security.py
      - name: Validate calendar regression tests
        run: python -m unittest discover -s tests -p 'test_competitor_sale_calendar.py' -v
      - name: Validate PDP YoY preservation and mobile layout
        run: |
          python -m unittest discover -s tests -p 'test_pdp_yoy_guard.py' -v
          python -m unittest discover -s tests -p 'test_mobile_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_problem_diagnosis.py' -v
      - name: Check existing public artifact security policy without modifying data
        run: python scripts/dashboard_security.py --root reports --root site
      - name: Record verified candidate
        shell: bash
        run: |
          printf 'Release candidate: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code
