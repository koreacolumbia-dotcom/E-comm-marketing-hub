name: Deploy Private Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Dashboard Finalize"]
    types: [completed]

concurrency:
  group: private-dashboard-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dashboard-production
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python --version

      - name: Verify canonical production readiness
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/canonical/snapshot.json
          test -s reports/canonical/quality.json
          test -s reports/canonical/features.json
          test -s reports/v2/data.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('reports/canonical/quality.json').read_text(encoding='utf-8'))
          v=json.loads(Path('reports/v2/data.json').read_text(encoding='utf-8'))
          print(f"[QUALITY] status={q['status']} score={q['score']}")
          print(f"[PERIOD] {v.get('period')} ({v.get('period_type')})")
          if q['status']=='blocked':
              raise SystemExit('[ERROR] Production deploy blocked by canonical data quality gate')
          m=v.get('metrics') or {}
          if not all(m.get(k) is not None for k in ('sessions','orders','revenue')):
              raise SystemExit('[ERROR] Canonical KPI bundle is incomplete')
          if m['orders'] > m['sessions']:
              raise SystemExit('[ERROR] Impossible KPI relation: orders > sessions')
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          echo "Wrangler version: $(npx --no-install wrangler --version)"

      - name: Rebuild static V2 before bundling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_v2_safe.py
          python scripts/render_v2_safe.py
          test -s reports/v2/index.html
          if grep -q '<script' reports/v2/index.html; then
            echo "[ERROR] V2 must be server-side static HTML without inline JavaScript"
            exit 1
          fi
          grep -q '서버사이드 정적 렌더링' reports/v2/index.html
          grep -q '오늘의 핵심 KPI' reports/v2/index.html

      - name: Prepare bounded static bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_cloudflare_bundle.py
          test -f dist/index.html
          test -s dist/reports/v2/index.html
          test -s dist/reports/canonical/quality.json
          echo "Bundle size: $(du -sh dist | cut -f1)"
          echo "Bundle files: $(find dist -type f | wc -l)"
          if find dist -type f -size +24M -print -quit | grep -q .; then
            echo "[ERROR] Cloudflare bundle still contains a file over 24 MiB"
            find dist -type f -size +24M -print
            exit 1
          fi

      - name: Sanitize and scan deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_security.py --sanitize --root dist

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "[OK] Cloudflare credentials are configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "[WARN] Cloudflare credentials are missing; bundle validation succeeded but deployment will be skipped"
          fi

      - name: Deploy ecom Worker with static assets
        if: ${{ steps.cloudflare.outputs.ready == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config wrangler.jsonc

      - name: Deployment skipped
        if: ${{ steps.cloudflare.outputs.ready != 'true' }}
        shell: bash
        run: |
          echo "Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the dashboard-production environment or repository Actions secrets."
