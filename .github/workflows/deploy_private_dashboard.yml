name: Deploy Private Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Dashboard Finalize"]
    types: [completed]

concurrency:
  group: private-dashboard-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dashboard-production
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install local Wrangler 4
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          echo "Local Wrangler: $(npx --no-install wrangler --version)"

      - name: Prepare bounded static bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_cloudflare_bundle.py
          test -f dist/index.html
          echo "Bundle size: $(du -sh dist | cut -f1)"
          echo "Bundle files: $(find dist -type f | wc -l)"
          find dist -type f -size +24M -print -quit | grep -q . && {
            echo "[ERROR] Cloudflare bundle still contains a file over 24 MiB"
            find dist -type f -size +24M -print
            exit 1
          } || true

      - name: Sanitize and scan deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_security.py --sanitize --root dist

      - name: Deploy ecom Worker with static assets
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.jsonc

      - name: Print deployment result
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
          COMMAND_STDERR: ${{ steps.cloudflare_deploy.outputs.command-stderr }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then echo "Deployment URL: $DEPLOYMENT_URL"; fi
          if [ -n "$COMMAND_STDERR" ]; then
            echo "Wrangler stderr:"
            printf '%s\n' "$COMMAND_STDERR"
          fi
