name: Deploy Private Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Dashboard Finalize"]
    types: [completed]

concurrency:
  group: private-dashboard-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dashboard-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Security scan generated reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_security.py --sanitize

      - name: Prepare bounded static bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_cloudflare_bundle.py
          test -f dist/index.html
          echo "Bundle size: $(du -sh dist | cut -f1)"
          echo "Bundle files: $(find dist -type f | wc -l)"
          find dist -type f -size +24M -print -quit | grep -q . && {
            echo "[ERROR] Cloudflare bundle still contains a file over 24 MiB"
            find dist -type f -size +24M -print
            exit 1
          } || true

      - name: Deploy ecom Worker with static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
