name: Deploy Private Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Dashboard Finalize"]
    types: [completed]

concurrency:
  group: private-dashboard-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dashboard-production
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          echo "Wrangler version: $(npx --no-install wrangler --version)"

      - name: Prepare bounded static bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_cloudflare_bundle.py
          test -f dist/index.html
          echo "Bundle size: $(du -sh dist | cut -f1)"
          echo "Bundle files: $(find dist -type f | wc -l)"
          if find dist -type f -size +24M -print -quit | grep -q .; then
            echo "[ERROR] Cloudflare bundle still contains a file over 24 MiB"
            find dist -type f -size +24M -print
            exit 1
          fi

      - name: Sanitize and scan deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_security.py --sanitize --root dist

      - name: Deploy ecom Worker with static assets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler deploy --config wrangler.jsonc
