name: Owned PDP YoY

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Daily report date (YYYY-MM-DD); blank uses yesterday KST"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Daily Digest"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/patch_owned_pdp_yoy.py"
      - "scripts/pdp_yoy_guard.py"
      - "tests/test_pdp_yoy_guard.py"
      - ".github/workflows/owned_pdp_yoy.yml"
  schedule:
    # Daily Digest runs at 09:30 KST. Re-check at 09:50 KST after its commit is available.
    - cron: "50 0 * * *"

concurrency:
  group: owned-pdp-yoy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest Daily Digest output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve report date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_date || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            YMD="$INPUT_DATE"
          else
            YMD="$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')"
          fi
          if [ -z "$INPUT_DATE" ] && [ ! -s "reports/daily_digest/daily/${YMD}.html" ]; then
            LATEST="$(find reports/daily_digest/daily -maxdepth 1 -type f -name '20??-??-??.html' | sort | tail -n 1)"
            if [ -n "$LATEST" ]; then
              LATEST_DATE="$(basename "$LATEST" .html)"
              if python - "$YMD" "$LATEST_DATE" <<'PY'
          import datetime as dt,sys
          requested,latest=(dt.date.fromisoformat(v) for v in sys.argv[1:3])
          sys.exit(0 if 0 <= (requested-latest).days <= 7 else 1)
          PY
              then
                echo "[WARN] Requested $YMD not generated; repairing latest available $LATEST_DATE"
                YMD="$LATEST_DATE"
              fi
            fi
          fi
          echo "ymd=$YMD" >> "$GITHUB_OUTPUT"
          echo "[DATE] $YMD"

      - name: Check whether YoY patch is already current
        id: check
        shell: bash
        env:
          YMD: ${{ steps.date.outputs.ymd }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.pdp_yoy_guard import is_current_report, load_payload, verified_series

          ymd = os.environ["YMD"]
          report = Path(f"reports/daily_digest/daily/{ymd}.html")
          data_path = Path(f"reports/daily_digest/data/daily/{ymd}.json")
          index = Path("reports/daily_digest/index.html")
          if not report.is_file() or not data_path.is_file():
              print(f"[WARN] Missing report/data for {ymd}; waiting for Daily Digest")
              needed, requires_bq = False, False
          else:
              text = report.read_text(encoding="utf-8")
              data = load_payload(data_path)
              embedded = is_current_report(text, data)
              original_yoy = bool(verified_series(data))
              patched = ('Current 7D vs prior-year comparable 7D' in text
                         and bool(data.get('pdp_series_yoy', {}).get('rows')))
              in_sync = index.is_file() and index.read_bytes() == report.read_bytes()
              needed = not ((embedded or patched) and in_sync)
              requires_bq = needed and not original_yoy and not patched
              print(f"[AUDIT] embedded_yoy={embedded} legacy_patched={patched} index_current={in_sync}"
                    f" patch_needed={needed} bigquery_fallback={requires_bq}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"needed={str(needed).lower()}\n")
              output.write(f"require_bigquery={str(requires_bq).lower()}\n")
          PY

      - name: Setup Python
        if: ${{ steps.check.outputs.needed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded PDP dependencies
        if: ${{ steps.check.outputs.needed == 'true' && steps.check.outputs.require_bigquery == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-cloud-bigquery pandas db-dtypes pyarrow
          python -m py_compile scripts/patch_owned_pdp_yoy.py

      - name: Patch PDP category trend with prior year
        if: ${{ steps.check.outputs.needed == 'true' }}
        shell: bash
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          YMD: ${{ steps.date.outputs.ymd }}
          DAILY_DIGEST_BQ_EVENTS_TABLE: columbia-ga4.analytics_358593394.events_*
          DAILY_DIGEST_BQ_LOCATION: asia-northeast3
        run: |
          set -euo pipefail
          python -m py_compile scripts/pdp_yoy_guard.py scripts/patch_owned_pdp_yoy.py
          python -m unittest discover -s tests -p 'test_pdp_yoy_guard.py' -v
          python -u scripts/patch_owned_pdp_yoy.py
          test -s "reports/daily_digest/daily/${YMD}.html"
          test -s "reports/daily_digest/data/daily/${YMD}.json"
          test -s "reports/daily_digest/index.html"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.pdp_yoy_guard import is_current_report, load_payload
          ymd=os.environ["YMD"]
          html=Path(f"reports/daily_digest/daily/{ymd}.html").read_text(encoding="utf-8")
          data=load_payload(Path(f"reports/daily_digest/data/daily/{ymd}.json"))
          assert is_current_report(html,data) or (
              'Current 7D vs prior-year comparable 7D' in html and data.get('pdp_series_yoy',{}).get('rows')
          ), "PDP YoY regression"
          print("[VERIFY] PDP 7D YoY source preserved")
          PY

      - name: Commit patched Owned report
        if: ${{ steps.check.outputs.needed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add "reports/daily_digest/daily/${YMD}.html" "reports/daily_digest/data/daily/${YMD}.json" reports/daily_digest/index.html
          if git diff --cached --quiet; then
            echo "[INFO] No PDP YoY changes"
            exit 0
          fi
          git commit -m "Keep prior-year PDP trend in Owned report"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
