name: Dashboard Finalize

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail when critical report data is stale or missing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Reports Build begins at 01:00 KST. Finalize after slow crawlers complete.
    - cron: "30 21 * * *" # 06:30 KST

concurrency:
  group: dashboard-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest generated reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild Summary after report jobs
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=""
          for candidate in \
            build_summary_dashboard.py \
            build_summary.py \
            summary_dashboard.py \
            build_reports_summary.py
          do
            if [ -f "$candidate" ]; then
              BUILDER="$candidate"
              break
            fi
          done

          if [ -n "$BUILDER" ]; then
            echo "[INFO] Rebuilding Summary with $BUILDER"
            python -u "$BUILDER"
          else
            echo "[WARN] No standalone Summary builder found. Freshness metadata will still be finalized."
          fi

      - name: Normalize metadata and audit freshness
        shell: bash
        env:
          STRICT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || 'false' }}
        run: |
          set -euo pipefail
          if [ "$STRICT_INPUT" = "true" ]; then
            python scripts/dashboard_healthcheck.py --strict
          else
            python scripts/dashboard_healthcheck.py
          fi

      - name: Validate dashboard navigation targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          index = Path("index.html")
          if not index.exists():
              raise SystemExit("[ERROR] index.html missing")

          text = index.read_text(encoding="utf-8")
          targets = sorted(set(re.findall(r'data-target="([^"]+)"', text)))
          missing = [target for target in targets if not Path(target).exists()]

          print(f"[CHECK] navigation targets={len(targets)}")
          for target in targets:
              print(f" - {'OK' if Path(target).exists() else 'MISSING'} {target}")

          if missing:
              raise SystemExit("[ERROR] Missing dashboard targets: " + ", ".join(missing))
          PY

      - name: Commit finalized dashboard metadata
        shell: bash
        run: |
          set -euo pipefail
          git add reports/meta.json \
            reports/member_funnel/data/meta.json \
            reports/ai_agent/data/meta.json \
            reports/index.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[INFO] No finalization changes"
            exit 0
          fi

          git commit -m "Finalize dashboard health metadata"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "[WARN] Push conflict; retry $attempt/5"
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo "[ERROR] Could not push dashboard finalization"
          exit 1
