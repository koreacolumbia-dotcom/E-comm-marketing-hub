name: Dashboard Finalize

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail when critical report data is stale or missing"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_run:
    workflows: ["Reports Build", "PDP Opportunity Build"]
    types: [completed]
  schedule:
    - cron: "30 21 * * *" # 06:30 KST

concurrency:
  group: dashboard-finalize
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest generated reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy openpyxl
          fi
          python - <<'PY'
          import numpy
          import openpyxl
          import pandas
          print("[OK] Python dependencies loaded")
          PY

      - name: Rebuild Summary after report jobs
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=""
          for candidate in build_summary_dashboard.py build_summary.py summary_dashboard.py build_reports_summary.py; do
            if [ -f "$candidate" ]; then BUILDER="$candidate"; break; fi
          done
          if [ -n "$BUILDER" ]; then python -u "$BUILDER"; else echo "[WARN] No standalone Summary builder found"; fi

      - name: Normalize metadata and audit freshness
        shell: bash
        env:
          STRICT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || 'false' }}
        run: |
          set -euo pipefail
          if [ "$STRICT_INPUT" = "true" ]; then python scripts/dashboard_healthcheck.py --strict; else python scripts/dashboard_healthcheck.py; fi

      - name: Generate executive and PDP intelligence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_intelligence.py

      - name: Build E-commerce Marketing Hub v2
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/dashboard_v2.py scripts/connect_pdp_to_dashboard.py
          python scripts/dashboard_v2.py
          if [ -s reports/pdp_opportunity/data.json ]; then
            python scripts/connect_pdp_to_dashboard.py
          else
            echo "[WARN] PDP data not built yet; V2 will remain in discovery mode"
          fi
          test -f reports/v2/index.html
          test -f reports/v2/data.json

      - name: Add data health board and action center
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_enhance.py
          python scripts/dashboard_experience.py

      - name: Sanitize public artifacts and block sensitive data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dashboard_security.py --sanitize
          python scripts/dashboard_security.py

      - name: Validate dashboard navigation targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          index = Path("index.html")
          if not index.exists():
              raise SystemExit("[ERROR] index.html missing")
          text = index.read_text(encoding="utf-8")
          targets = sorted(set(re.findall(r'data-target="([^"]+)"', text)))
          local_targets = []
          for target in targets:
              clean = target.split("#", 1)[0].split("?", 1)[0]
              if clean and not re.match(r"^[a-z]+://", clean, re.I):
                  local_targets.append((target, clean))
          missing = [original for original, clean in local_targets if not Path(clean).exists()]
          print(f"[CHECK] navigation targets={len(targets)}")
          for original, clean in local_targets:
              print(f" - {'OK' if Path(clean).exists() else 'MISSING'} {original}")
          if missing:
              raise SystemExit("[ERROR] Missing dashboard targets: " + ", ".join(missing))
          PY

      - name: Build alert summary and optional email
        id: alert
        continue-on-error: true
        env:
          DASHBOARD_SMTP_HOST: ${{ secrets.DASHBOARD_SMTP_HOST }}
          DASHBOARD_SMTP_PORT: ${{ secrets.DASHBOARD_SMTP_PORT }}
          DASHBOARD_SMTP_USER: ${{ secrets.DASHBOARD_SMTP_USER }}
          DASHBOARD_SMTP_PASSWORD: ${{ secrets.DASHBOARD_SMTP_PASSWORD }}
          DASHBOARD_ALERT_EMAIL: ${{ secrets.DASHBOARD_ALERT_EMAIL }}
        shell: bash
        run: |
          python scripts/dashboard_alert.py
          cat reports/dashboard_alert.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or close dashboard health issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python -c 'import json; print(json.load(open("reports/meta.json"))["overall_status"])')"
          TITLE="[Dashboard Alert] Data freshness or security attention required"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ "$STATUS" != "fresh" ]; then
            if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body-file reports/dashboard_alert.md; else gh issue create --title "$TITLE" --body-file reports/dashboard_alert.md; fi
          elif [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "All monitored reports are fresh. Closing automatically."
            gh issue close "$EXISTING"
          fi

      - name: Commit finalized dashboard outputs
        shell: bash
        run: |
          set -euo pipefail
          git add reports/meta.json reports/member_funnel/data/meta.json reports/ai_agent/data/meta.json reports/index.html reports/dashboard_alert.md reports/dashboard_intelligence.json reports/v2 index.html reports site 2>/dev/null || true
          if git diff --cached --quiet; then echo "[INFO] No finalization changes"; exit 0; fi
          git commit -m "Finalize dashboard intelligence, v2 and mobile experience"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
