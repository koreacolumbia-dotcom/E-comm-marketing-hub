name: Performance Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *" # 09:20 KST
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance_dashboard.yml'
      - 'scripts/build_performance_dashboard_bq.py'
      - 'scripts/build_performance_dashboard_cached.py'
      - 'scripts/refresh_performance_source_medium_cache.py'

concurrency:
  group: performance-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy openpyxl google-cloud-bigquery db-dtypes pyarrow

      - name: Configure Google credentials
        shell: bash
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SA_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SA_JSON_B64" | base64 -d > "$RUNNER_TEMP/gcp-key.json"
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          else
            echo "Missing Google service-account secret (GOOGLE_SA_JSON_B64 or GCP_SA_KEY)"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Validate performance scripts
        run: |
          test -s scripts/build_performance_dashboard_bq.py
          test -s scripts/build_performance_dashboard_cached.py
          test -s scripts/refresh_performance_source_medium_cache.py
          python -m py_compile scripts/build_performance_dashboard_bq.py
          python -m py_compile scripts/build_performance_dashboard_cached.py
          python -m py_compile scripts/refresh_performance_source_medium_cache.py

      - name: Refresh daily source-medium cache
        env:
          GCP_PROJECT: columbia-ga4
          GA4_DATASET: analytics_358593394
          OUT_DIR: reports
        run: |
          python -u scripts/refresh_performance_source_medium_cache.py
          test -s reports/performance_source_medium_daily.csv

      - name: Build performance dashboard from cache
        env:
          GCP_PROJECT: columbia-ga4
          GA4_DATASET: analytics_358593394
          OUT_DIR: reports
        run: |
          python -u scripts/build_performance_dashboard_cached.py
          test -s reports/performance_dashboard.html
          test -s reports/performance_data.json
          test -s reports/performance_data.json.gz
          test -s reports/performance_data_recent.json
          test -s reports/performance_data_recent.json.gz
          test -s reports/performance_export.xlsx

      - name: Add Performance menu to hub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-key="performance"' not in s:
              anchor = '''        <div class="nav-item" data-key="utm_channel" data-target="reports/utm_channel/index.html" data-label="소스/매체 분석">'''
              item = '''        <div class="nav-item" data-key="performance" data-target="reports/performance_dashboard.html" data-label="Performance Dashboard">\n          <i class="fa-solid fa-chart-pie"></i><span>Performance Dashboard</span>\n        </div>\n\n'''
              s = s.replace(anchor, item + anchor, 1)
              mobile_anchor = '<div class="mo-tab" data-key="utm_channel"'
              if mobile_anchor in s:
                  mobile_item = '<div class="mo-tab" data-key="performance" data-target="reports/performance_dashboard.html" data-label="Performance Dashboard"><i class="fa-solid fa-chart-pie text-base"></i><div class="text-[10px]">성과</div></div>\n    '
                  s = s.replace(mobile_anchor, mobile_item + mobile_anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit report, cache and hub link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reports/performance_dashboard.html reports/performance_data.json reports/performance_data.json.gz reports/performance_data_recent.json reports/performance_data_recent.json.gz reports/performance_export.xlsx reports/performance_source_medium_daily.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update performance dashboard"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --depth=50 origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
