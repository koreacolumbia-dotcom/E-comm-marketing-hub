name: Patch Performance Dashboard Menu Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_performance_menu_once.yml'

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pc = '''        <div class="nav-item" data-key="performance" data-target="reports/performance_dashboard.html" data-label="Performance Dashboard">
          <i class="fa-solid fa-chart-pie"></i><span>Performance Dashboard</span>
        </div>

'''
          mobile = '''    <div class="mo-tab" data-key="performance" data-target="reports/performance_dashboard.html" data-label="Performance Dashboard">
      <i class="fa-solid fa-chart-pie text-base"></i>
      <div class="text-[10px]">성과</div>
    </div>

'''

          if 'data-key="performance"' not in s:
              pc_anchor = '''        <div class="nav-item" data-key="utm_channel" data-target="reports/utm_channel/index.html" data-label="소스/매체 분석">'''
              if pc_anchor not in s:
                  raise SystemExit('PC menu anchor not found')
              s = s.replace(pc_anchor, pc + pc_anchor, 1)

              mobile_anchor = '''    <div class="mo-tab" data-key="utm_channel" data-target="reports/utm_channel/index.html" data-label="소스/매체 분석">'''
              if mobile_anchor not in s:
                  raise SystemExit('Mobile menu anchor not found')
              s = s.replace(mobile_anchor, mobile + mobile_anchor, 1)

          if 'performance: "reports/meta.json"' not in s:
              meta_anchor = '''      utm_channel: "reports/utm_channel/data/meta.json",'''
              if meta_anchor not in s:
                  raise SystemExit('META_PATH_BY_KEY anchor not found')
              s = s.replace(meta_anchor, '      performance: "reports/meta.json",\n' + meta_anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit menu and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_performance_menu_once.yml
          git add index.html
          git commit -m "Add Performance Dashboard navigation" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
