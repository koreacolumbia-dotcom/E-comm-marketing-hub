name: Apply standalone SaaS design to report URLs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standalone-theme-apply.yml"
      - "scripts/apply_csk_saas_theme.py"
      - "assets/csk-saas-standalone.js"
      - "reports/**/*.html"
      - "edm-intelligence.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-saas-apply
  cancel-in-progress: false

jobs:
  theme:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Decorate only menu-backed standalone reports
        run: |
          set -euo pipefail
          python scripts/apply_csk_saas_theme.py
          python scripts/apply_csk_saas_theme.py --check --quiet
          python -m unittest discover -s tests -p 'test_csk_standalone_theme.py' -v
      - name: Commit styled HTML without touching data or daily reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only explicitly requested report pages, never the daily report HTML.
          python - <<'PY'
          import subprocess
          from scripts.apply_csk_saas_theme import TARGETS
          subprocess.run(["git", "add", "--", *TARGETS.values()], check=True)
          PY
          if git diff --cached --quiet; then
            echo '[THEME] All standalone pages already styled'
            exit 0
          fi
          git commit -m "Apply shared SaaS theme to standalone report URLs"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo '[THEME] Standalone pages published to main'
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo '[THEME] Rebase conflict; preserving changes for manual review'
              exit 1
            }
            sleep 2
          done
          exit 1
