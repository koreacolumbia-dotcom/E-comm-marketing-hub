name: Daily Digest

on:
  # Recovery run from this file's commit. Production artifacts are outside this path.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-digest.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual run reason (optional)"
        required: false
        default: "manual"
        type: string
      daily_hub_only:
        description: "Build Daily Digest HUB only? (no email)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      debug:
        description: "Enable debug logs?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    # 07:15 KST: morning build + email (22:15 UTC on previous day).
    # 14:20 KST: silent GA4 channel-attribution reconciliation (05:20 UTC).
    # GitHub scheduled starts are best-effort, not a guaranteed delivery timestamp.
    - cron: "15 22 * * *"
    - cron: "20 5 * * *"

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main (rebase)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Resolve run modes
        id: modes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.daily_hub_only }}" = "true" ]; then
            DAILY_HUB_ONLY="true"
          else
            DAILY_HUB_ONLY="false"
          fi

          echo "run_daily=true" >> "$GITHUB_OUTPUT"
          # Afternoon schedule refreshes HTML/PNG/JSON but never emails the team.
          # On-demand "daily_hub_only" also rebuilds without email.
          if [ "$DAILY_HUB_ONLY" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Seoul date '+%H')" -ge 12 ]; }; then
            echo "send_daily_email=false" >> "$GITHUB_OUTPUT"
          else
            echo "send_daily_email=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "debug=${{ inputs.debug }}" >> "$GITHUB_OUTPUT"
          else
            echo "debug=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              db-dtypes \
              pyarrow \
              google-cloud-bigquery \
              pandas \
              python-dateutil \
              scikit-learn \
              sentence-transformers \
              pillow \
              requests \
              playwright \
              openpyxl \
              matplotlib
          fi

          # requirements.txt 와 별개로 Daily Digest 추가 패키지 보강 설치
          pip install openpyxl matplotlib pytrends

          python -m playwright install --with-deps chromium

      - name: Smoke-test PDP YoY chart before report build
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile daily_digest_live_final.py
          python - <<'PY'
          from daily_digest_live_final import pdp_compare_svg
          svg = pdp_compare_svg(
              ['11/05','11/06','11/07','11/08','11/09','11/10','11/11'],
              [2,3,4,5,4,3,2], [1,1,1,2,3,2,1],
              ['11/06','11/07','11/08','11/09','11/10','11/11','11/12'],
          )
          assert "<svg" in svg and "polyline" in svg and "11/11" in svg
          print("[OK] 7D PDP YoY SVG function renders.")
          PY

      - name: Ensure reports dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            reports \
            reports/search_volume/data \
            site/data \
            site/assets \
            site/assets/products \
            site/assets/reviews \
            site/assets/text_images

      - name: Set KST time (for badge/meta + yesterday)
        id: set_time
        shell: bash
        run: |
          set -euo pipefail
          echo "kst=$(TZ=Asia/Seoul date '+%Y.%m.%d (%a) %H:%M KST')" >> "$GITHUB_OUTPUT"
          echo "kst_date=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "yesterday_ymd=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          # Monday (Asia/Seoul) sends the prior Monday-Sunday report.
          if [ "$(TZ=Asia/Seoul date '+%u')" = "1" ]; then
            echo "digest_mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "digest_mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug KMA secret presence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          v = os.getenv("DAILY_DIGEST_KMA_SERVICE_KEY", "")
          print("KMA key exists:", bool(v))
          print("KMA key length:", len(v))
          PY

      - name: Build Daily or Weekly Digest (through yesterday)
        if: ${{ steps.modes.outputs.run_daily == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          YMD: ${{ steps.set_time.outputs.yesterday_ymd }}
          DAILY_DIGEST_REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}

          DAILY_DIGEST_SKIP_IF_EXISTS: "false"
          DAILY_DIGEST_USE_DATA_CACHE: "false"
          DAILY_DIGEST_WRITE_DATA_CACHE: "true"
          DAILY_DIGEST_SKIP_HUB_WRITE: "false"

          DAILY_DIGEST_ADMIN_BQ_PROJECT: columbia-ga4
          DAILY_DIGEST_ADMIN_BQ_LOCATION: asia-northeast3
          DAILY_DIGEST_ADMIN_BQ_TABLE: crm_mart.member_funnel_admin_daily

          DAILY_DIGEST_TARGET_ROAS_XLS_PATH: target_roas.xlsx
          DAILY_DIGEST_MEDIA_SPEND_XLS_PATH: paid_media_spend.xlsx
          DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}

          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}

        run: |
          set -euo pipefail

          if [ -z "${GA4_PROPERTY_ID:-}" ]; then
            echo "[ERROR] GA4_PROPERTY_ID is empty; abort report build."
            exit 1
          fi

          if [ -z "${GOOGLE_SA_JSON_B64:-}" ]; then
            echo "[ERROR] GOOGLE_SA_JSON_B64 is empty; abort report build."
            exit 1
          fi

          if [ -z "${DAILY_DIGEST_KMA_SERVICE_KEY:-}" ]; then
            echo "[WARN] DAILY_DIGEST_KMA_SERVICE_KEY is empty. weather forecast will be disabled."
          fi

          echo "$GOOGLE_SA_JSON_B64" | base64 -d > /tmp/ga_sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ga_sa.json

          mkdir -p reports/daily_digest/{daily,weekly} reports/daily_digest/data/{daily,weekly}

          echo "[INFO] Purge old ${DAILY_DIGEST_REPORT_MODE} outputs for ${YMD}"
          if [ "${DAILY_DIGEST_REPORT_MODE}" = "weekly" ]; then
            rm -f "reports/daily_digest/weekly/END_${YMD}.html" \
                  "reports/daily_digest/data/weekly/END_${YMD}.json" || true
            export GA4_START_DATE="$(date -d "${YMD} -6 days" '+%Y-%m-%d')"
          else
            rm -f "reports/daily_digest/daily/${YMD}.html" \
                  "reports/daily_digest/data/daily/${YMD}.json" || true
            export GA4_START_DATE="${YMD}"
          fi
          export GA4_END_DATE="${YMD}"
          echo "[INFO] Build ${DAILY_DIGEST_REPORT_MODE}: ${GA4_START_DATE} ~ ${GA4_END_DATE}"

          # 패치 버전 실행
          python -u daily_digest_live_final.py --out-dir reports/daily_digest

          echo "[INFO] Outputs:"
          ls -la reports/daily_digest/daily | tail -n 40 || true
          ls -la reports/daily_digest/data/daily | tail -n 40 || true

      - name: Render Daily or Weekly Digest PNG
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          YMD: ${{ steps.set_time.outputs.yesterday_ymd }}
          REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}
        run: |
          set -euo pipefail

          if [ "${REPORT_MODE}" = "weekly" ]; then
            HTML="reports/daily_digest/weekly/END_${YMD}.html"
            PNG="reports/daily_digest/weekly/END_${YMD}.png"
          else
            HTML="reports/daily_digest/daily/${YMD}.html"
            PNG="reports/daily_digest/daily/${YMD}.png"
          fi

          if [ ! -s "$HTML" ]; then
            echo "[ERROR] Daily HTML missing before PNG render: $HTML"
            ls -la reports/daily_digest/daily || true
            exit 1
          fi

          python -u scripts/render_daily_png.py "$HTML" "$PNG"
          test -s "$PNG"
          ls -la "$PNG"

          # Wednesday GA4 reconciliation: keep the published weekly PNG in
          # sync with its refreshed HTML, without sending another email.
          if [ "$(TZ=Asia/Seoul date '+%u')" = "3" ] && [ "${REPORT_MODE}" = "daily" ]; then
            WEEK_END="$(date -d "${YMD} -2 days" '+%Y-%m-%d')"
            WEEK_HTML="reports/daily_digest/weekly/END_${WEEK_END}.html"
            WEEK_PNG="reports/daily_digest/weekly/END_${WEEK_END}.png"
            if [ -f "${WEEK_HTML}" ]; then
              python -u scripts/render_daily_png.py "${WEEK_HTML}" "${WEEK_PNG}"
            fi
          fi

      - name: Commit & push Daily Digest results
        if: ${{ success() }}
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A reports/daily_digest scripts || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git fetch origin main
          git pull --rebase --autostash origin main

          git add -A reports/daily_digest scripts || true
          if git diff --cached --quiet; then
            echo "No changes to commit after rebase"
            exit 0
          fi

          git commit -m "Daily Digest auto update" || true

          for i in 1 2 3; do
            echo "[INFO] push attempt $i/3"
            if git push origin HEAD:main; then
              echo "[OK] pushed"
              exit 0
            fi

            echo "[WARN] push rejected. Rebase with latest origin/main and retry..."
            git fetch origin main
            git pull --rebase --autostash origin main
          done

          echo "[ERROR] failed to push after retries"
          exit 1

      - name: Send Daily or Weekly Digest email
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' && steps.modes.outputs.send_daily_email == 'true' }}
        # Do not report a green workflow when the report mail actually fails.
        continue-on-error: false
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DAILY_RECIPIENTS: ${{ vars.DAILY_RECIPIENTS }}
          HUB_URL: ${{ vars.HUB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          export KST_STAMP="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          export REPORT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')"
          export REPORT_MODE="${{ steps.set_time.outputs.digest_mode }}"
          if [ "${REPORT_MODE}" = "weekly" ]; then
            export DAILY_DIGEST_PNG_PATH="reports/daily_digest/weekly/END_${REPORT_DATE}.png"
            export DAILY_DIGEST_HTML_PATH="reports/daily_digest/weekly/END_${REPORT_DATE}.html"
          else
            export DAILY_DIGEST_PNG_PATH="reports/daily_digest/daily/${REPORT_DATE}.png"
            export DAILY_DIGEST_HTML_PATH="reports/daily_digest/daily/${REPORT_DATE}.html"
          fi

          if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ] || [ -z "${DAILY_RECIPIENTS:-}" ]; then
            echo "[ERROR] SMTP or DAILY_RECIPIENTS config missing -> cannot send report"
            exit 1
          fi

          if [ ! -s "${DAILY_DIGEST_PNG_PATH}" ] || [ ! -s "${DAILY_DIGEST_HTML_PATH}" ]; then
            echo "[ERROR] Both PNG and HTML attachments are required -> cannot send report"
            exit 1
          fi

          if [ -f "scripts/send_daily_email.py" ]; then
            python -u scripts/send_daily_email.py
          elif [ -f "send_daily_email.py" ]; then
            python -u send_daily_email.py
          else
            echo "[ERROR] send_daily_email.py not found"
            exit 1
          fi
