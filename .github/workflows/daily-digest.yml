name: Daily Digest
# Rebuild after ETC warning and PDP source reconciliation fixes.
# Recovery trigger: rebuild current prior-day report without automatic email; verify before sending.

on:
  # Explicit recovery push rebuilds and emails the exact prior-day report.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-digest.yml"
  workflow_dispatch:
    inputs:
      recovery_only:
        description: "Rebuild Nov 13-14 without sending any email"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reason:
        description: "Manual run reason (optional)"
        required: false
        default: "manual"
        type: string
      daily_hub_only:
        description: "Build Daily Digest HUB only? (no email)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      debug:
        description: "Enable debug logs?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    # 06:15 KST: morning build + email (21:15 UTC on previous day).
    # 14:00 KST: silent GA4 channel-attribution reconciliation (05:00 UTC).
    # GitHub scheduled starts are best-effort, not a guaranteed delivery timestamp.
    - cron: "15 21 * * *"
    - cron: "0 5 * * *"

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # One-time byte-for-byte bundle to hand off to connected Gmail.
  export_existing:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Export 2026-11-13 Daily Digest attachments for Gmail' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final report
        uses: actions/checkout@v4
      - name: Verify existing HTML and PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/daily_digest/daily/2026-11-13.html
          test -s reports/daily_digest/daily/2026-11-13.png
          file reports/daily_digest/daily/2026-11-13.png
          sha256sum reports/daily_digest/daily/2026-11-13.{html,png}
      - name: Export report originals
        uses: actions/upload-artifact@v4
        with:
          name: DailyDigest_2026-11-13_HTML_PNG
          if-no-files-found: error
          retention-days: 7
          path: |
            reports/daily_digest/daily/2026-11-13.html
            reports/daily_digest/daily/2026-11-13.png

  # One-time repair sender. Reuse the published HTML/PNG; no slow data rebuild.
  resend_existing:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Resend 2026-11-13 Daily Digest with attachments' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published report
        uses: actions/checkout@v4

      - name: Resend 2026-11-13 final report with HTML and PNG attached
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DAILY_RECIPIENTS: ${{ vars.DAILY_RECIPIENTS }}
          HUB_URL: ${{ vars.HUB_URL }}
          REPORT_DATE: "2026-11-13"
          REPORT_MODE: "daily"
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/daily_digest/daily/2026-11-13.html
          test -s reports/daily_digest/daily/2026-11-13.png
          test -n "${SMTP_HOST:-}"
          test -n "${SMTP_USER:-}"
          test -n "${SMTP_PASS:-}"
          test -n "${DAILY_RECIPIENTS:-}"
          # send_daily_email.py adds NaYeon.Kwak@columbia.com to the existing six.
          python -u scripts/send_daily_email.py

  backfill_etc:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.recovery_only == 'true') || (github.event_name == 'push' && github.event.head_commit.message == 'Diagnose ETC and PDP rebuild Nov 13-14 no email') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install openpyxl matplotlib pytrends
          python -m playwright install --with-deps chromium
      - name: Rebuild November 13 and 14 from GA4, never email
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          DAILY_DIGEST_ADMIN_BQ_PROJECT: columbia-ga4
          DAILY_DIGEST_ADMIN_BQ_LOCATION: asia-northeast3
          DAILY_DIGEST_ADMIN_BQ_TABLE: crm_mart.member_funnel_admin_daily
          DAILY_DIGEST_TARGET_ROAS_XLS_PATH: target_roas.xlsx
          DAILY_DIGEST_MEDIA_SPEND_XLS_PATH: paid_media_spend.xlsx
          DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          DAILY_DIGEST_REPORT_MODE: daily
          DAILY_DIGEST_SKIP_IF_EXISTS: "false"
          DAILY_DIGEST_USE_DATA_CACHE: "false"
          DAILY_DIGEST_WRITE_DATA_CACHE: "true"
          DAILY_DIGEST_SKIP_HUB_WRITE: "false"
        shell: bash
        run: |
          set -euo pipefail
          echo "$GOOGLE_SA_JSON_B64" | base64 -d > /tmp/ga_sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ga_sa.json
          export DAILY_DIGEST_END_DATE_OVERRIDE="2026-11-14"
          export YMD="2026-11-14" GA4_START_DATE="2026-11-13" GA4_END_DATE="2026-11-14"
          python -u daily_digest_live_final.py --out-dir reports/daily_digest
          for day in 2026-11-13 2026-11-14; do
            python -u scripts/render_daily_png.py "reports/daily_digest/daily/$day.html" "reports/daily_digest/daily/$day.png"
            test -s "reports/daily_digest/daily/$day.html"
            test -s "reports/daily_digest/daily/$day.png"
          done
          qa_failed=0
          for day in 2026-11-13 2026-11-14; do
            python -u scripts/validate_daily_digest.py --date "$day" --require-pdp || qa_failed=1
          done
          test "$qa_failed" -eq 0
      - name: Retain failed rebuild artifacts for diagnosis (never publish or email)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-recovery-diagnostics-${{ github.run_id }}
          path: |
            reports/daily_digest/data/daily/2026-11-13.json
            reports/daily_digest/data/daily/2026-11-14.json
            reports/daily_digest/daily/2026-11-13.html
            reports/daily_digest/daily/2026-11-14.html
            reports/daily_digest/daily/2026-11-13.png
            reports/daily_digest/daily/2026-11-14.png
          if-no-files-found: warn
          retention-days: 7
      - name: Publish revised reports without sending mail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/daily_digest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Nov 13-14 attribution reports"
          git pull --rebase origin main
          git push origin HEAD:main

  run:
    # One-time silent refresh for today; normal future refreshes use the schedule.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.recovery_only != 'true') && (github.event_name != 'push' || github.event.head_commit.message != 'Diagnose ETC and PDP rebuild Nov 13-14 no email') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main (rebase)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Resolve run modes
        id: modes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.daily_hub_only }}" = "true" ]; then
            DAILY_HUB_ONLY="true"
          else
            DAILY_HUB_ONLY="false"
          fi

          echo "run_daily=true" >> "$GITHUB_OUTPUT"
          # Afternoon schedule refreshes HTML/PNG/JSON but never emails the team.
          # On-demand "daily_hub_only" also rebuilds without email.
          if [ "$DAILY_HUB_ONLY" = "true" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.head_commit.message }}" != "Recover 2026-11-14 Daily Digest and email" ]; } || { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ]; }; then
            echo "send_daily_email=false" >> "$GITHUB_OUTPUT"
          else
            echo "send_daily_email=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "debug=${{ inputs.debug }}" >> "$GITHUB_OUTPUT"
          else
            echo "debug=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              db-dtypes \
              pyarrow \
              google-cloud-bigquery \
              pandas \
              python-dateutil \
              scikit-learn \
              sentence-transformers \
              pillow \
              requests \
              playwright \
              openpyxl \
              matplotlib
          fi

          # requirements.txt 와 별개로 Daily Digest 추가 패키지 보강 설치
          pip install openpyxl matplotlib pytrends

          python -m playwright install --with-deps chromium

      - name: Smoke-test session source, CASE mapping and PDP YoY
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile daily_digest_live_final.py daily_digest_session_source.py scripts/validate_daily_digest.py
          python - <<'PY'
          from daily_digest_live_final import pdp_compare_svg, classify_looker_channel
          cases = [
              ("google / cpc", "pmax", "Paid Ad"),
              ("google / cpc", "youtube", "Awareness"),
              ("kakao_ch / message", "season", "Owned Channel"),
              ("sms / lms", "crm", "Owned Channel"),
              ("l.instagram.com / referral", "", "Organic Traffic"),
              ("creator_crew / creator_crew", "", "Organic Traffic"),
              ("instagram / story", "", "Official SNS"),
              ("(not set) / (not set)", "", "etc"),
              ("(direct) / (none)", "", "Organic Traffic"),
          ]
          for sm, campaign, expected in cases:
              actual = classify_looker_channel(sm, campaign, "Unassigned")
              assert actual == expected, (sm, campaign, expected, actual)
          print("[OK] Existing Columbia CASE rules verified.")
          from daily_digest_session_source import build_sql
          from types import SimpleNamespace
          from datetime import date
          table = SimpleNamespace(project="columbia-ga4",dataset_id="analytics_358593394",table_id="events_20261116",
              schema=[SimpleNamespace(name="session_traffic_source_last_click"), SimpleNamespace(name="collected_traffic_source")])
          sql = build_sql([(date(2026,11,16),"daily",table)],"2026-11-16","2026-11-16")
          assert "session_key" in sql and "ROW_NUMBER()" in sql and "first_user_source" not in sql
          print("[OK] Session-key SQL compiled into query string.")
          pdp_sql = build_sql([(date(2026,11,16),"daily",table)],"2026-11-16","2026-11-16",pdp_lookup_table="columbia-ga4.analytics_358593394.events_*")
          assert "CROSS JOIN UNNEST(e.items)" in pdp_sql and "LEFT JOIN attribution AS a" in pdp_sql and "COUNT(*) AS views" in pdp_sql
          assert "session_metrics AS" not in pdp_sql and "GROUP BY 1,2,3" in pdp_sql
          print("[OK] PDP source/medium uses shared attribution and item views.")
          svg = pdp_compare_svg(
              ['11/05','11/06','11/07','11/08','11/09','11/10','11/11'],
              [2,3,4,5,4,3,2], [1,1,1,2,3,2,1],
              ['11/06','11/07','11/08','11/09','11/10','11/11','11/12'],
          )
          assert "<svg" in svg and "polyline" in svg and "11/11" in svg
          print("[OK] 7D PDP YoY SVG function renders.")
          PY

      - name: Ensure reports dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            reports \
            reports/search_volume/data \
            site/data \
            site/assets \
            site/assets/products \
            site/assets/reviews \
            site/assets/text_images

      - name: Set KST time (for badge/meta + yesterday)
        id: set_time
        shell: bash
        run: |
          set -euo pipefail
          echo "kst=$(TZ=Asia/Seoul date '+%Y.%m.%d (%a) %H:%M KST')" >> "$GITHUB_OUTPUT"
          echo "kst_date=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          yesterday="$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')"
          echo "yesterday_ymd=$yesterday" >> "$GITHUB_OUTPUT"
          daily_start="$yesterday"
          if [ "${{ github.event_name == 'push' && github.event.head_commit.message == 'Rebuild Nov 13-16 with session-key CASE logic' }}" = "true" ] && [[ "$yesterday" > "2026-11-12" ]]; then
            daily_start="2026-11-13"
          fi
          echo "daily_start=$daily_start" >> "$GITHUB_OUTPUT"
          # The 14:00 rerun always refreshes YESTERDAY's daily report,
          # including Sundays reviewed on Monday. Keep Monday morning weekly.
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ]; } || [ "${{ github.event_name }}" = "push" ]; then
            echo "digest_mode=daily" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Asia/Seoul date '+%u')" = "1" ]; then
            echo "digest_mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "digest_mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug KMA secret presence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          v = os.getenv("DAILY_DIGEST_KMA_SERVICE_KEY", "")
          print("KMA key exists:", bool(v))
          print("KMA key length:", len(v))
          PY

      - name: Build Daily or Weekly Digest (through yesterday)
        if: ${{ steps.modes.outputs.run_daily == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          YMD: ${{ steps.set_time.outputs.yesterday_ymd }}
          DAILY_DIGEST_REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}
          DAILY_DIGEST_REPAIR_START: ${{ steps.set_time.outputs.daily_start }}

          DAILY_DIGEST_SKIP_IF_EXISTS: "false"
          DAILY_DIGEST_USE_DATA_CACHE: "false"
          DAILY_DIGEST_WRITE_DATA_CACHE: "true"
          DAILY_DIGEST_SKIP_HUB_WRITE: "false"

          DAILY_DIGEST_ADMIN_BQ_PROJECT: columbia-ga4
          DAILY_DIGEST_ADMIN_BQ_LOCATION: asia-northeast3
          DAILY_DIGEST_ADMIN_BQ_TABLE: crm_mart.member_funnel_admin_daily

          DAILY_DIGEST_TARGET_ROAS_XLS_PATH: target_roas.xlsx
          DAILY_DIGEST_MEDIA_SPEND_XLS_PATH: paid_media_spend.xlsx
          DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}

          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}

        run: |
          set -euo pipefail

          if [ -z "${GA4_PROPERTY_ID:-}" ]; then
            echo "[ERROR] GA4_PROPERTY_ID is empty; abort report build."
            exit 1
          fi

          if [ -z "${GOOGLE_SA_JSON_B64:-}" ]; then
            echo "[ERROR] GOOGLE_SA_JSON_B64 is empty; abort report build."
            exit 1
          fi

          if [ -z "${DAILY_DIGEST_KMA_SERVICE_KEY:-}" ]; then
            echo "[WARN] DAILY_DIGEST_KMA_SERVICE_KEY is empty. weather forecast will be disabled."
          fi

          echo "$GOOGLE_SA_JSON_B64" | base64 -d > /tmp/ga_sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ga_sa.json

          mkdir -p reports/daily_digest/{daily,weekly} reports/daily_digest/data/{daily,weekly}

          echo "[INFO] Purge old ${DAILY_DIGEST_REPORT_MODE} outputs for ${YMD}"
          if [ "${DAILY_DIGEST_REPORT_MODE}" = "weekly" ]; then
            rm -f "reports/daily_digest/weekly/END_${YMD}.html" \
                  "reports/daily_digest/data/weekly/END_${YMD}.json" || true
            export GA4_START_DATE="$(date -d "${YMD} -6 days" '+%Y-%m-%d')"
          else
            rm -f "reports/daily_digest/daily/${YMD}.html" \
                  "reports/daily_digest/data/daily/${YMD}.json" || true
            export GA4_START_DATE="${YMD}"
          fi
          export GA4_END_DATE="${YMD}"
          echo "[INFO] Build ${DAILY_DIGEST_REPORT_MODE}: ${GA4_START_DATE} ~ ${GA4_END_DATE}"

          # 패치 버전 실행
          built=false
          for attempt in 1 2 3; do
            echo "[INFO] build attempt $attempt/3"
            if python -u daily_digest_live_final.py --out-dir reports/daily_digest; then
              built=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 45; fi
          done
          if [ "$built" != "true" ]; then
            echo "[ERROR] build failed after three attempts; no email"
            exit 1
          fi

          echo "[INFO] Outputs:"
          ls -la reports/daily_digest/daily | tail -n 40 || true
          ls -la reports/daily_digest/data/daily | tail -n 40 || true

      - name: Render Daily or Weekly Digest PNG
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          YMD: ${{ steps.set_time.outputs.yesterday_ymd }}
          REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}
          DAILY_START: ${{ steps.set_time.outputs.daily_start }}
        run: |
          set -euo pipefail

          if [ "${REPORT_MODE}" = "weekly" ]; then
            HTML="reports/daily_digest/weekly/END_${YMD}.html"
            PNG="reports/daily_digest/weekly/END_${YMD}.png"
            test -s "$HTML"
            python -u scripts/render_daily_png.py "$HTML" "$PNG"
            test -s "$PNG"
          else
            day="$DAILY_START"
            while [[ "$day" < "$YMD" || "$day" == "$YMD" ]]; do
              HTML="reports/daily_digest/daily/$day.html"
              PNG="reports/daily_digest/daily/$day.png"
              test -s "$HTML"
              python -u scripts/render_daily_png.py "$HTML" "$PNG"
              test -s "$PNG"
              day="$(date -d "$day +1 day" '+%Y-%m-%d')"
            done
          fi

          # Wednesday GA4 reconciliation: keep the published weekly PNG in
          # sync with its refreshed HTML, without sending another email.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ] && [ "$(TZ=Asia/Seoul date '+%u')" = "3" ] && [ "${REPORT_MODE}" = "daily" ]; then
            WEEK_END="$(date -d "${YMD} -2 days" '+%Y-%m-%d')"
            WEEK_HTML="reports/daily_digest/weekly/END_${WEEK_END}.html"
            WEEK_PNG="reports/daily_digest/weekly/END_${WEEK_END}.png"
            if [ -f "${WEEK_HTML}" ]; then
              python -u scripts/render_daily_png.py "${WEEK_HTML}" "${WEEK_PNG}"
            fi
          fi

      - name: Quality gate — block invalid Daily Digest and email
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' }}
        shell: bash
        env:
          REPORT_DATE: ${{ steps.set_time.outputs.yesterday_ymd }}
          REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}
          DAILY_START: ${{ steps.set_time.outputs.daily_start }}
        run: |
          set -euo pipefail
          if [ "$REPORT_MODE" = "weekly" ]; then
            python -u scripts/validate_daily_digest.py --date "$REPORT_DATE" --mode weekly --require-pdp --require-session-source
          else
            failed=0
            day="$DAILY_START"
            while [[ "$day" < "$REPORT_DATE" || "$day" == "$REPORT_DATE" ]]; do
              python -u scripts/validate_daily_digest.py --date "$day" --require-pdp --require-session-source || failed=1
              day="$(date -d "$day +1 day" '+%Y-%m-%d')"
            done
            if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ] && [ "$(TZ=Asia/Seoul date '+%u')" = "3" ]; then
              WEEK_END="$(date -d "$REPORT_DATE -2 days" '+%Y-%m-%d')"
              if [ -f "reports/daily_digest/weekly/END_$WEEK_END.html" ]; then
                python -u scripts/validate_daily_digest.py --date "$WEEK_END" --mode weekly --require-pdp --require-session-source || failed=1
              fi
            fi
            test "$failed" -eq 0
          fi

      # Data quality failures must not erase the newly generated HTML/PNG/JSON.
      # Retain an explicitly UNVERIFIED bundle for diagnosis, never email/publish it.
      - name: Preserve unverified Daily Digest artifacts when quality gate fails
        if: ${{ failure() && steps.modes.outputs.run_daily == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-UNVERIFIED-${{ steps.set_time.outputs.yesterday_ymd }}-${{ github.run_id }}
          path: |
            reports/daily_digest/daily/${{ steps.set_time.outputs.yesterday_ymd }}.html
            reports/daily_digest/daily/${{ steps.set_time.outputs.yesterday_ymd }}.png
            reports/daily_digest/data/daily/${{ steps.set_time.outputs.yesterday_ymd }}.json
            reports/daily_digest/daily/2026-11-13.html
            reports/daily_digest/daily/2026-11-13.png
            reports/daily_digest/data/daily/2026-11-13.json
            reports/daily_digest/daily/2026-11-14.html
            reports/daily_digest/daily/2026-11-14.png
            reports/daily_digest/data/daily/2026-11-14.json
            reports/daily_digest/daily/2026-11-15.html
            reports/daily_digest/daily/2026-11-15.png
            reports/daily_digest/data/daily/2026-11-15.json
            reports/daily_digest/weekly/END_${{ steps.set_time.outputs.yesterday_ymd }}.html
            reports/daily_digest/weekly/END_${{ steps.set_time.outputs.yesterday_ymd }}.png
            reports/daily_digest/data/weekly/END_${{ steps.set_time.outputs.yesterday_ymd }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Explain held publication in run summary
        if: ${{ failure() && steps.modes.outputs.run_daily == 'true' }}
        shell: bash
        run: |
          echo '## Daily Digest not published — QA failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The generated JSON, HTML, and PNG were retained as an UNVERIFIED workflow artifact for diagnosis.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Email and public report publication were intentionally blocked to avoid distributing invalid figures.' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & push Daily Digest results
        if: ${{ success() }}
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A reports/daily_digest scripts || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git fetch origin main
          git pull --rebase --autostash origin main

          git add -A reports/daily_digest scripts || true
          if git diff --cached --quiet; then
            echo "No changes to commit after rebase"
            exit 0
          fi

          git commit -m "Daily Digest auto update" || true

          for i in 1 2 3; do
            echo "[INFO] push attempt $i/3"
            if git push origin HEAD:main; then
              echo "[OK] pushed"
              exit 0
            fi

            echo "[WARN] push rejected. Rebase with latest origin/main and retry..."
            git fetch origin main
            git pull --rebase --autostash origin main
          done

          echo "[ERROR] failed to push after retries"
          exit 1

      # Preserve the exact verified original before attempting SMTP, so a
      # credential/transport outage does not require another BigQuery rebuild.
      - name: Prepare validated email backup package
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' }}
        env:
          REPORT_DATE: ${{ steps.set_time.outputs.yesterday_ymd }}
          REPORT_MODE: ${{ steps.set_time.outputs.digest_mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest-email-backup"
          if [ "$REPORT_MODE" = weekly ]; then
            base="reports/daily_digest/weekly/END_$REPORT_DATE"
            label="WeeklyDigest_$REPORT_DATE"
          else
            base="reports/daily_digest/daily/$REPORT_DATE"
            label="DailyDigest_$REPORT_DATE"
          fi
          cp "$base.png" "$RUNNER_TEMP/digest-email-backup/$label.png"
          cp "$base.html" "$RUNNER_TEMP/digest-email-backup/$label.html"
          sha256sum "$RUNNER_TEMP/digest-email-backup/$label.png"
      - name: Preserve verified email backup package
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-email-${{ steps.set_time.outputs.digest_mode }}-${{ steps.set_time.outputs.yesterday_ymd }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digest-email-backup/
          if-no-files-found: error
          retention-days: 7

      - name: Send Daily or Weekly Digest email
        if: ${{ success() && steps.modes.outputs.run_daily == 'true' && steps.modes.outputs.send_daily_email == 'true' && !(github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') }}
        # Do not report a green workflow when the report mail actually fails.
        continue-on-error: false
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DAILY_RECIPIENTS: ${{ vars.DAILY_RECIPIENTS }}
          HUB_URL: ${{ vars.HUB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          export KST_STAMP="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          export REPORT_DATE="${{ steps.set_time.outputs.yesterday_ymd }}"
          export REPORT_MODE="${{ steps.set_time.outputs.digest_mode }}"
          if [ "${REPORT_MODE}" = "weekly" ]; then
            export DAILY_DIGEST_PNG_PATH="reports/daily_digest/weekly/END_${REPORT_DATE}.png"
            export DAILY_DIGEST_HTML_PATH="reports/daily_digest/weekly/END_${REPORT_DATE}.html"
          else
            export DAILY_DIGEST_PNG_PATH="reports/daily_digest/daily/${REPORT_DATE}.png"
            export DAILY_DIGEST_HTML_PATH="reports/daily_digest/daily/${REPORT_DATE}.html"
          fi

          if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ] || [ -z "${DAILY_RECIPIENTS:-}" ]; then
            echo "[ERROR] SMTP or DAILY_RECIPIENTS config missing -> cannot send report"
            exit 1
          fi

          if [ ! -s "${DAILY_DIGEST_PNG_PATH}" ] || [ ! -s "${DAILY_DIGEST_HTML_PATH}" ]; then
            echo "[ERROR] Both PNG and HTML attachments are required -> cannot send report"
            exit 1
          fi

          # The Python sender adds the additional NaYeon.Kwak recipient without
          # changing the six existing recipients stored in DAILY_RECIPIENTS.

          if [ -f "scripts/send_daily_email.py" ]; then
            python -u scripts/send_daily_email.py
          elif [ -f "send_daily_email.py" ]; then
            python -u send_daily_email.py
          else
            echo "[ERROR] send_daily_email.py not found"
            exit 1
          fi

      - name: Send combined PDP and Glink PNG test to Hugh only
        if: ${{ success() && github.event_name == 'push' && github.event.head_commit.message == 'Rebuild combined PDP and Glink paid test to Hugh only' && github.run_attempt == 1 }}
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DAILY_RECIPIENTS: 'hugh.kang@columbia.com'
          HUB_URL: ${{ vars.HUB_URL }}
          REPORT_DATE: '2026-11-16'
          REPORT_MODE: daily
          MODE_DAILY_ONLY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/validate_daily_digest.py --date "$REPORT_DATE" --require-pdp --require-session-source
          python - <<'PY'
          import json
          import math
          import importlib.util
          from pathlib import Path
          obj = json.loads(Path("reports/daily_digest/data/daily/2026-11-16.json").read_text())
          pdp = obj["pdp_series"]
          assert pdp["source_medium_date"] == "2026-11-16"
          assert len(pdp["rows"]) == 14
          for row in pdp["rows"]:
              if row["views_d1"] > 0:
                  assert row["source_status"] == "ok", (row["itemCategory"], row["source_status"])
                  assert 1 <= len(row["top_sources"]) <= 2
                  assert sum(x["views"] for x in row["top_sources"]) <= row["views_d1"]
          paid = obj["glink_paid_snapshot"]
          assert paid["start"] == paid["end"] == "2026-11-16"
          total = next(x for x in paid["rows"] if x["channel"] == "Total incl. sign-up")
          assert math.isclose(total["spend"], 1556470.5109, abs_tol=0.05)
          html = Path("reports/daily_digest/daily/2026-11-16.html").read_text()
          assert "D1 TOP 2 Source / Medium" in html and "Glink 매체RAW" in html
          spec = importlib.util.spec_from_file_location("sender", "scripts/send_daily_email.py")
          sender = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sender)
          original = sender.send_email_mixed_with_inline_image
          def test_only(**kwargs):
              kwargs["to_list"] = ["hugh.kang@columbia.com"]
              kwargs["subject"] = "[TEST] PDP Source / Medium + Paid | " + kwargs["subject"]
              assert kwargs["inline_png_bytes"]
              original(**kwargs)
              print("[TEST OK] SMTP accepted combined PNG for Hugh only", flush=True)
          sender.send_email_mixed_with_inline_image = test_only
          sender.main()
          PY
