name: CSK Winter Festival Membership Campaign YoY
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_festival_signup_campaign_yoy.py'
      - '.github/workflows/csk-winter-festival-signup-campaign-yoy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: csk-winter-festival-membership-campaign-yoy
  cancel-in-progress: false
jobs:
  ga4-campaign-yoy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/build_festival_signup_campaign_yoy.py
            reports/decision_health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile SQL-free GA4 API analysis
        run: python -m py_compile scripts/build_festival_signup_campaign_yoy.py
      - name: Install read-only GA4 auth client
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Compare 2025 and 2026 membership acquisition signup campaigns
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/build_festival_signup_campaign_yoy.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/decision_health/winter_festival_signup_campaign_yoy_2026.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['status'] in ('ga4_measured_yoy','query_error','blocked_credentials')
          assert not any(x in str(j).lower() for x in
              ('user_pseudo_id','member_id','phone_number','email_address','transaction_id','ga_session_id'))
          if j['status']=='ga4_measured_yoy':
              assert set(j['periods'])=={'D1-D2','D1-D3'}
              for period in j['periods'].values():
                  for y in ('2025','2026'):
                      a=period['years'][y]
                      assert sum(r['signups'] for r in a['rows'])==a['totals']['signups']
          print('Membership acquisition comparison',j['status'])
          PY
      - name: Commit aggregated, sanitized comparison only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/decision_health/winter_festival_signup_campaign_yoy_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 2025 vs 2026 membership acquisition campaign signups'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
