name: CSK Winter Festival Signup Source Medium YoY
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_festival_signup_source_medium_yoy.py'
      - '.github/workflows/csk-winter-festival-signup-yoy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: csk-winter-festival-signup-yoy
  cancel-in-progress: false
jobs:
  signup-yoy:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/build_festival_signup_source_medium_yoy.py
            reports/decision_health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static check
        run: python -m py_compile scripts/build_festival_signup_source_medium_yoy.py
      - name: Install GA4 authentication
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Compare festival signups by GA4 source medium for both event years
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/build_festival_signup_source_medium_yoy.py
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('reports/decision_health/winter_festival_signup_source_medium_yoy_2026.json')
          result=json.loads(path.read_text(encoding='utf-8'))
          assert result['status'] in ('ga4_measured_yoy','blocked_credentials','query_error')
          assert not any(x in str(result).lower() for x in
              ('user_pseudo_id','member_id','phone_number','email_address','ga_session_id','transaction_id'))
          if result['status']=='ga4_measured_yoy':
              assert all(result['periods'][p]['totals']['2026']['signup_complete']>=0 for p in ('D1-D2','D1-D3'))
          print('GA4 historical signup report:',result['status'])
          PY
      - name: Publish aggregated history only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/decision_health/winter_festival_signup_source_medium_yoy_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish historical Winter Festival signup source medium YoY'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
