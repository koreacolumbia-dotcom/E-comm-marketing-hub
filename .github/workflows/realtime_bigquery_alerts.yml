name: Realtime BigQuery Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

concurrency:
  group: realtime-bigquery-alerts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_REVISION=realtime-alerts-decision-os-v1"
          echo "GIT_SHA=$(git rev-parse HEAD)"
          grep -n "DECLARE query_end_ts" scripts/build_realtime_bigquery_alerts.py
          if grep -nE 'UNNEST\(IF\(ARRAY_LENGTH\(items\)' scripts/build_realtime_bigquery_alerts.py; then exit 1; fi
          test -s reports/v2/data.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-cloud-bigquery
          python -m py_compile scripts/build_realtime_bigquery_alerts.py scripts/connect_realtime_alerts.py scripts/build_decision_os.py scripts/render_v2_safe.py

      - name: Detect BigQuery anomalies
        shell: bash
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          BQ_PROJECT: columbia-ga4
          BQ_LOCATION: asia-northeast3
          GA4_EVENTS_TABLE: columbia-ga4.analytics_358593394.events_*
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SA_JSON_B64"
          python -u scripts/build_realtime_bigquery_alerts.py
          test -s reports/realtime_alerts/alerts.json
          test -s reports/realtime_alerts/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/realtime_alerts/alerts.json').read_text(encoding='utf-8'))
          required={'generated_at','observed_hour','status','alert_count','critical_count','warning_count','monitored_dimensions','alerts'}
          missing=required-set(d)
          if missing: raise SystemExit('[ERROR] missing fields: '+', '.join(sorted(missing)))
          if d['monitored_dimensions'] <= 0: raise SystemExit('[ERROR] no monitored dimensions')
          print(f"[OK] status={d['status']} alerts={d['alert_count']} dimensions={d['monitored_dimensions']}")
          PY

      - name: Build Decision OS and render dashboard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/connect_realtime_alerts.py
          python scripts/build_decision_os.py
          python scripts/render_v2_safe.py
          test -s reports/v2/data.json
          test -s reports/v2/index.html
          test -s reports/decision_os/data.json
          test -s reports/decision_os/state.json
          test -s reports/decision_os/index.html
          grep -q 'Executive Command Center' reports/v2/index.html
          grep -q 'Incident Center' reports/v2/index.html
          grep -q 'Feature Readiness' reports/v2/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          v2=json.loads(Path('reports/v2/data.json').read_text(encoding='utf-8'))
          rt=v2.get('realtime_alerts') or {}
          os=v2.get('decision_os') or {}
          if not rt: raise SystemExit('[ERROR] realtime alerts not connected')
          if not os or len(os.get('feature_status',[])) != 10: raise SystemExit('[ERROR] Decision OS modules not connected')
          print(f"[CONNECTED] realtime={rt.get('status')} incidents={len(os.get('incidents',[]))} features={len(os.get('feature_status',[]))}")
          PY

      - name: Commit realtime and Decision OS outputs
        shell: bash
        run: |
          set -euo pipefail
          git add reports/realtime_alerts reports/v2 reports/decision_os
          if git diff --cached --quiet; then echo "[INFO] No realtime changes"; exit 0; fi
          git commit -m "Refresh realtime alerts and Decision OS"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
