name: AI Agent Full Report

on:
  workflow_dispatch:
    inputs:
      run_etl:
        description: "Run MSSQL -> BigQuery ETL first?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      etl_mode:
        description: "ETL mode"
        required: true
        default: "order_mart"
        type: choice
        options:
          - "order_mart"
          - "crm_raw"
          - "all"
      days_back:
        description: "Order mart lookback days"
        required: true
        default: "760"
      include_statuses:
        description: "TB_OrderProduct.CodeOrderStatusNo filter"
        required: true
        default: "4,5"
      cart_days_back:
        description: "TB_Cart signal lookback days"
        required: true
        default: "180"
      sync_start_date:
        description: "CRM raw sync start date"
        required: true
        default: "2026-02-01"
      bq_write_disposition:
        description: "BigQuery write disposition"
        required: true
        default: "WRITE_TRUNCATE"
        type: choice
        options:
          - "WRITE_TRUNCATE"
          - "WRITE_APPEND"
      report_date:
        description: "Report date YYYY-MM-DD. Empty = KST yesterday"
        required: false
        default: ""

  schedule:
    # 08:20 KST daily = 23:20 UTC previous day
    - cron: "20 23 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-agent-full-report
  cancel-in-progress: false

jobs:
  ai-agent-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      TZ: Asia/Seoul

      # BigQuery
      BQ_PROJECT: ${{ vars.BQ_PROJECT || 'columbia-ga4' }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION || 'asia-northeast3' }}
      BQ_RAW_DATASET: ${{ vars.BQ_RAW_DATASET || 'crm_raw' }}
      BQ_MART_DATASET: ${{ vars.BQ_MART_DATASET || 'crm_mart' }}
      BQ_META_DATASET: ${{ vars.BQ_META_DATASET || 'crm_meta' }}
      BQ_ORDER_PRODUCT_TABLE: ${{ vars.BQ_ORDER_PRODUCT_TABLE || 'tb_order_product_search_mart' }}
      BQ_ADMIN_DAILY_TABLE: ${{ vars.BQ_ADMIN_DAILY_TABLE || 'member_funnel_admin_daily' }}
      BQ_WRITE_DISPOSITION: ${{ github.event.inputs.bq_write_disposition || 'WRITE_TRUNCATE' }}

      # Google credential
      GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}

      # Optional AI providers for HTML summary
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.1-8b-instant' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'gemini,groq,openrouter' }}

      # MSSQL, only needed when run_etl=true
      MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"
      MSSQL_SERVER: ${{ secrets.MSSQL_SERVER }}
      MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
      MSSQL_PORT: ${{ secrets.MSSQL_PORT || '1433' }}
      MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
      MSSQL_USERNAME: ${{ secrets.MSSQL_USERNAME }}
      MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
      MSSQL_TIMEOUT_SEC: "30"

      # ETL controls
      ORDER_ETL_INCLUDE_PRODUCT_STATUS: ${{ github.event.inputs.include_statuses || '4,5' }}
      ORDER_ETL_DAYS_BACK: ${{ github.event.inputs.days_back || '760' }}
      CART_DAYS_BACK: ${{ github.event.inputs.cart_days_back || '180' }}
      SYNC_START_DATE: ${{ github.event.inputs.sync_start_date || '2026-02-01' }}
      ENABLE_STATUS_SIGNAL: "yes"
      ENABLE_POINT_SIGNAL: "yes"
      ENABLE_CART_SIGNAL: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set report date
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.report_date || '' }}" ]; then
            REPORT_DATE="${{ github.event.inputs.report_date }}"
          else
            REPORT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' +'%Y-%m-%d')"
          fi
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"
          echo "report_date=${REPORT_DATE}" >> "$GITHUB_OUTPUT"
          echo "REPORT_DATE=${REPORT_DATE}"

      - name: Install Microsoft ODBC Driver 18
        if: ${{ github.event.inputs.run_etl == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https unixodbc-dev ca-certificates
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas pyodbc google-cloud-bigquery pyarrow db-dtypes requests

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/build_ai_agent_html_report.py || (echo "Missing scripts/build_ai_agent_html_report.py" && exit 1)
          if [ "${{ github.event.inputs.run_etl || 'false' }}" = "true" ]; then
            test -f scripts/mssql_to_bq_order_search_etl.py || test -f scripts/columbia_ai_agent_crm_order_etl_final.py || (echo "Missing ETL py file" && exit 1)
          fi

      - name: Validate GitHub secrets for BigQuery
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SA_JSON_B64:-}" ]; then
            echo "GOOGLE_SA_JSON_B64 secret is missing."
            exit 1
          fi

      - name: Validate MSSQL secrets
        if: ${{ github.event.inputs.run_etl == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MSSQL_SERVER:-}" ] && [ -z "${MSSQL_HOST:-}" ]; then
            echo "Set MSSQL_SERVER or MSSQL_HOST secret."
            exit 1
          fi
          if [ -z "${MSSQL_DATABASE:-}" ]; then
            echo "Set MSSQL_DATABASE secret."
            exit 1
          fi
          if [ -z "${MSSQL_USERNAME:-}" ] || [ -z "${MSSQL_PASSWORD:-}" ]; then
            echo "Set MSSQL_USERNAME and MSSQL_PASSWORD secrets."
            exit 1
          fi

      - name: Run MSSQL to BigQuery ETL
        if: ${{ github.event.inputs.run_etl == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ETL_SCRIPT="scripts/mssql_to_bq_order_search_etl.py"
          if [ ! -f "$ETL_SCRIPT" ]; then
            ETL_SCRIPT="scripts/columbia_ai_agent_crm_order_etl_final.py"
          fi
          python "$ETL_SCRIPT" \
            --mode "${{ github.event.inputs.etl_mode || 'order_mart' }}" \
            --days-back "${{ github.event.inputs.days_back || '760' }}" \
            --include-statuses "${{ github.event.inputs.include_statuses || '4,5' }}" \
            --cart-days-back "${{ github.event.inputs.cart_days_back || '180' }}"

      - name: Skip ETL notice
        if: ${{ github.event.inputs.run_etl != 'true' }}
        shell: bash
        run: |
          echo "run_etl=false: skipping MSSQL connection. HTML will be generated from existing BigQuery tables."

      - name: Build AI Agent HTML report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ai_agent_html_report.py \
            --target-date "$REPORT_DATE"

      - name: Copy AI Agent report to site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/reports/ai_agent
          rsync -av reports/ai_agent/ site/reports/ai_agent/

          # Some hub index files link to reports/ai_agent/index.html directly.
          # Keep reports/ committed too.
          test -f reports/ai_agent/index.html
          test -f "reports/ai_agent/daily/${REPORT_DATE}.html" || true
          test -f "reports/ai_agent/data/${REPORT_DATE}.json" || true

          echo "Generated files:"
          find reports/ai_agent -maxdepth 3 -type f | sort
          echo "Site files:"
          find site/reports/ai_agent -maxdepth 3 -type f | sort

      - name: Upload AI Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-full-logs-and-report
          path: |
            reports/ai_agent/**
            site/reports/ai_agent/**
            logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push AI Agent report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ai_agent || true
          git add site/reports/ai_agent || true
          git add index.html || true

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update AI Agent report ${REPORT_DATE}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
