name: CSK Competitor Sale Calendar

on:
  workflow_dispatch: {}
  schedule:
    - cron: '40 23 * * *'
    - cron: '40 8 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/competitor-sale-calendar.yml'
      - 'scripts/build_competitor_sale_calendar.py'
      - 'tests/test_competitor_sale_calendar.py'
      - 'config/competitor_sale_events_verified.json'
      - 'reports/hero_main_banners_*.csv'
      - 'reports/competitor_intelligence/owned/*.json'

permissions:
  contents: write

concurrency:
  group: csk-competitor-sale-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout required evidence and code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_competitor_sale_calendar.py
            /tests/test_competitor_sale_calendar.py
            /config/competitor_sale_events_verified.json
            /reports/competitor_sale_calendar/
            /reports/hero_main_banners_*.csv
            /reports/competitor_intelligence/owned/
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate calendar source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_competitor_sale_calendar.py
          python -m unittest discover -s tests -p 'test_competitor_sale_calendar.py' -v
      - name: Build validated evidence calendar
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Seoul date +%F)"
          python scripts/build_competitor_sale_calendar.py --as-of "$TODAY" --lookback 65
          python -c 'import json; from pathlib import Path; d=json.loads(Path("reports/competitor_sale_calendar/latest.json").read_text()); assert d["schema_version"] == 1 and len(d["events"]) > 0; assert all(e.get("end_date") is None for e in d["events"] if e["kind"] in ("observed_banner", "verified_start")); print("Calendar:", d["as_of"], d["status"], len(d["events"]))'
      - name: Publish calendar snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/competitor_sale_calendar/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh dated competitor sale evidence'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
