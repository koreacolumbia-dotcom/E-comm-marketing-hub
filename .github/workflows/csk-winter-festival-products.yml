name: CSK Winter Festival Product YoY
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CSK Winter Festival UTM Owned Comparison"]
    types: [completed]
  schedule:
    # 11:20 KST daily, after event source snapshots.
    - cron: '20 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_festival_product_yoy.py'
      - 'tests/test_festival_product_yoy.py'
      - '.github/workflows/csk-winter-festival-products.yml'
permissions:
  contents: write
concurrency:
  group: csk-winter-festival-product-yoy
  cancel-in-progress: false
jobs:
  product-yoy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/build_festival_product_yoy.py
            tests/test_festival_product_yoy.py
            reports/decision_health
            reports/marketing_operations/latest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check safe same-event day item aggregation and exact item revenue bridge
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_festival_product_yoy.py
          python -m unittest discover -s tests -p 'test_festival_product_yoy.py' -v
      - name: Install existing GA4 BigQuery read-only dependencies
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery
      - name: Build capped product YoY evidence (two queries, 6 GiB max dry estimate)
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          set -euo pipefail
          python scripts/build_festival_product_yoy.py
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('reports/decision_health/winter_festival_products_yoy_2026.json').read_text())
          assert j['schema']==2 and j['causal'] is False
          assert j['status'] in ('ga4_measured','blocked_budget','blocked_credentials','query_error','insufficient_data')
          if j['status']=='ga4_measured':
              assert all(x in j['years'] for x in ('2025','2026'))
              assert j['quality']['item_revenue_diff_reconciled'] is True
              assert j['quality']['no_raw_ids_or_users'] is True
              assert j['cost']['total_dry_cap']==6*1024**3
              assert len(j['products'])==j['product_count']
              assert j['quality']['full_product_ranking_verified'] is True
              assert set(('both','only_2025','only_2026')).issubset(j['presence_counts'])
              assert set(('top_2025','top_2026','impact_up','impact_down',
                          'common_growth','common_decline')).issubset(j['rankings'])
              assert all(len(v)<=5 for v in j['rankings'].values())
          assert not any(x in str(j).lower() for x in ('user_pseudo_id','phone_number','ga_session_id'))
          print('PRODUCT FESTIVAL YOY:', j['status'],j['report_date'])
          PY
      - name: Commit only aggregate style revenue and units
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/decision_health/winter_festival_products_yoy_2026.json
          if git diff --cached --quiet; then
            echo 'Existing measured event product snapshot retained'
            exit 0
          fi
          git commit -m 'Refresh Winter Festival verified product style YoY'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
