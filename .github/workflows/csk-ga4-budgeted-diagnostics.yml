name: CSK GA4 Cost-Guarded Root Cause
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Digest"]
    types: [completed]
  schedule:
    - cron: '45 0 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/csk_ga4_cost_guard.py'
      - 'scripts/csk_warehouse_metadata.py'
      - 'scripts/csk_ga4_coupon_probe.py'
      - 'scripts/csk_ga4_product_funnel.py'
      - 'tests/test_csk_ga4_product_funnel.py'
      - 'tests/test_csk_ga4_coupon_probe.py'
      - 'tests/test_csk_warehouse_metadata.py'
      - 'tests/test_csk_ga4_cost_guard.py'
      - '.github/workflows/csk-ga4-budgeted-diagnostics.yml'
permissions:
  contents: write
concurrency:
  group: csk-ga4-cost-guarded
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/csk_ga4_cost_guard.py
            scripts/csk_warehouse_metadata.py
            scripts/csk_ga4_coupon_probe.py
            scripts/csk_ga4_product_funnel.py
            scripts/build_problem_diagnosis.py
            tests
            reports/daily_digest/data/daily
            reports/daily_intelligence/latest.json
            reports/marketing_operations/latest.json
            reports/competitor_content/strategy-summary.json
            reports/competitor_intelligence/latest-quality.json
            reports/competitor_sale_calendar/latest.json
            reports/decision_health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate budget, accounting algebra and privacy fixtures offline
        run: |
          python -m py_compile scripts/csk_ga4_cost_guard.py scripts/csk_warehouse_metadata.py scripts/csk_ga4_coupon_probe.py scripts/build_problem_diagnosis.py
          python -m unittest discover -s tests -p 'test_csk_ga4_cost_guard.py' -v
          python -m unittest discover -s tests -p 'test_csk_warehouse_metadata.py' -v
          python -m unittest discover -s tests -p 'test_csk_ga4_coupon_probe.py' -v
          python -m unittest discover -s tests -p 'test_problem_diagnosis.py' -v
      - name: Install only BigQuery client (no pandas)
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery
      - name: Read only 14 completed GA4 daily partitions with 1-GiB total cap
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/csk_ga4_cost_guard.py
          test -s reports/decision_health/ga4_purchase_diagnostics.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/decision_health/ga4_purchase_diagnostics.json').read_text())
          assert data.get('schema')==1
          assert data.get('cost',{}).get('maximum_bytes_billed_total')==1073741824
          assert data.get('status') in (
              'ga4_measured','partial_quality','blocked_credentials','blocked_budget','blocked_estimate')
          assert not any(k in str(data).lower() for k in ('user_pseudo_id','email_address','customer_phone'))
          print('[COST-AUDIT] status',data['status'],'date',data['report_date'],
                'billed_bytes',data.get('cost',{}).get('billed_bytes','not_run'))
          PY
      - name: Query 14-day matched-product session funnel with a separate 1-GiB hard cap
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python -m unittest discover -s tests -p 'test_csk_ga4_product_funnel.py' -v
          python scripts/csk_ga4_product_funnel.py
          python - <<'PY'
          import json
          from pathlib import Path
          out=json.loads(Path('reports/decision_health/product_funnel_evidence.json').read_text())
          assert out['schema']==1 and out['cost']['maximum_bytes_billed']==1073741824
          assert out['status'] in {'source_not_aligned','blocked_credentials','blocked_estimate','blocked_budget','query_error','no_matching_events','ga4_measured'}
          assert not any(k in str(out).lower() for k in ('user_pseudo_id','ga_session_id','email_address'))
          print('[PRODUCT FUNNEL] status',out['status'],'products',len(out.get('products',[])))
          PY
      - name: Inspect official GA4 and order mart metadata with zero scanned bytes
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/csk_warehouse_metadata.py
          python - <<'PY'
          import json
          from pathlib import Path
          item=json.loads(Path('reports/decision_health/source_metadata.json').read_text())
          assert item['schema']==1 and item['query_jobs_executed']==0 and item['bytes_scanned']==0
          print('Source metadata inspected: BQ query cost zero')
          PY
      - name: Verify purchase-item coupon usage (512-MiB cap)
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          python scripts/csk_ga4_coupon_probe.py
          test -s reports/decision_health/ga4_coupon_usage.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/decision_health/ga4_coupon_usage.json').read_text())
          assert data['schema']==1
          assert data.get('cost',{}).get('maximum_bytes_billed',0)==536870912
          print('Coupon evidence:',data['status'])
          PY
      - name: Refresh sourced problem diagnosis with GA4 evidence
        run: |
          python scripts/build_problem_diagnosis.py
          test -s reports/decision_health/diagnoses.json
      - name: Publish aggregate findings only
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/decision_health/ga4_purchase_diagnostics.json reports/decision_health/ga4_coupon_usage.json reports/decision_health/product_funnel_evidence.json reports/decision_health/source_metadata.json reports/decision_health/diagnoses.json
          if git diff --cached --quiet; then echo "[GA4] no changes"; exit 0; fi
          git commit -m "Update budget-capped GA4 product and root-cause evidence"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
