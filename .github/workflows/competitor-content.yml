name: Competitor Content Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'
  push:
    paths:
      - 'scripts/competitor_content/**'
      - 'reports/competitor_content/strategy.mjs'
      - 'reports/competitor_content/gap-summary.mjs'
      - 'reports/competitor_content/index.html'
      - '.github/workflows/competitor-content.yml'
permissions:
  contents: write
concurrency:
  group: competitor-content
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.51.0 aiohttp==3.11.18 pillow
      - run: python -m py_compile scripts/competitor_content/crawl.py
      - run: python scripts/competitor_content/evidence.py
      - run: python scripts/competitor_content/publication.py
      - run: python scripts/competitor_content/crawl.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/competitor_content/strategy.test.mjs
      - run: node scripts/competitor_content/gap-summary.test.mjs
      - run: node scripts/competitor_content/calendar.test.mjs
      - run: node scripts/competitor_content/advanced.test.mjs
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CRAWLER_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Validate conflict-safe publication merger
        run: python scripts/competitor_publish/safe_publish.py --self-test
      - name: Validate content dashboard contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('reports/competitor_content/index.html').read_text()
          summary=json.loads(Path('reports/competitor_content/strategy-summary.json').read_text())
          assert len(summary['brands'])==24, 'expected 24 tracked brands'
          for marker in ('id="classificationRules"','id="crawlHealth"','id="crawlHealthRows"','function classifyPlacement(x)',"fetch('strategy-summary.json'",'게재 위치: '):
              assert marker in html, f'missing dashboard contract: {marker}'
          for brand in summary['brands']:
              c=brand.get('url_coverage') or {}
              if c.get('known_urls') is not None:
                  assert c['observed_urls']<=c['known_urls'], brand['brand']
                  assert c['unobserved_urls']<=c['known_urls'], brand['brand']
          import re
          from collections import Counter
          ids=re.findall(r'\\bid="([^"]+)"',html)
          duplicates=[key for key,count in Counter(ids).items() if count>1]
          assert not duplicates, f'duplicate DOM ids: {duplicates}'
          anchors=re.findall(r'href="#([^"]+)"',html)
          missing=[key for key in anchors if key not in ids]
          assert not missing, f'broken in-page navigation: {missing}'
          expected_sections=['gapRadar','actionIntelligence','brandPulse','benchmark','purposePanel','strategyPanel','dnaPanel','advancedPanel','discoveryPanel','archive','calendarPanel','classificationRules','evidencePanel','crawlHealth','observedPanel','coveragePanel']
          positions=[html.index('id="'+key+'"') for key in expected_sections]
          assert positions==sorted(positions), 'dashboard strategic section order changed'
          assert 'coverageSummary=d;renderCrawlHealth()' in html, 'coverage summary is not wired to the view'
          assert 'function renderActionIntelligence()' in html and 'compareOwnedContent({' in html, 'action intelligence must use benchmark model'
          assert '높음·낮음 판정 기준' in html and '표본 충족 후 자동 판정' in html, 'observation threshold explanations missing'
          frontier=json.loads(Path('reports/competitor_content/crawl-frontier.json').read_text())
          assert len(frontier.get('brands',{}))==24, 'crawl frontier must track 24 brands'
          for brand,entry in frontier['brands'].items():
              pending=entry.get('pending',[])
              assert len(pending)==len(set(pending)), f'duplicate frontier URLs for {brand}'
              assert all(u.startswith('https://') for u in pending), f'non-HTTPS URL in frontier: {brand}'
              from urllib.parse import urlsplit
              assert all(urlsplit(u).hostname and not urlsplit(u).username and not urlsplit(u).password for u in pending), f'unsafe URL authority: {brand}'
              assert all(not urlsplit(u).fragment for u in pending), f'fragment in crawl frontier: {brand}'
          print('Dashboard DOM, navigation, strategy order, coverage, and frontier contracts verified')
          PY
      - name: Validate dashboard inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='script':
                      self.active=not dict(attrs).get('src'); self.parts=[]
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active:
                      self.scripts.append(''.join(self.parts)); self.active=False
          parser=Scripts()
          parser.feed(Path('reports/competitor_content/index.html').read_text())
          assert parser.scripts, 'missing inline dashboard scripts'
          for i, script in enumerate(parser.scripts):
              Path(f'/tmp/csk-competitor-inline-{i}.mjs').write_text(script)
          print(f'Extracted {len(parser.scripts)} inline scripts for syntax verification')
          PY
          for script in /tmp/csk-competitor-inline-*.mjs; do node --check "$script"; done
      - name: Test interactive drilldowns in Chromium
        run: python scripts/competitor_content/drilldown_test.py
      - name: Crawl official editorial pages
        env:
          CONTENT_PAGE_LIMIT: '120'
          CONTENT_PRIORITY_PAGE_LIMIT: '180'
          CONTENT_BRAND_SECONDS: '1200'
          CONTENT_SCROLL_LIMIT: '80'
          CONTENT_CRAWL_SLICE_SECONDS: '110'
          CONTENT_CRAWL_SHARDS: '4'
          CONTENT_EXTRA_CATCHUP_BRANDS: '0'
          CONTENT_TARGET_SAMPLE: '50'
          CONTENT_MAINTENANCE_PAGE_LIMIT: '40'
          CONTENT_MAINTENANCE_SECONDS: '300'
        run: python scripts/competitor_content/crawl.py
      - name: Update content calendar archive
        run: python scripts/competitor_content/calendar_archive.py
      - name: Generate strategy audit from measured feed
        run: |
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; import {analyze} from './reports/competitor_content/strategy.mjs'; const r=analyze(JSON.parse(readFileSync('reports/competitor_content/latest.json','utf8'))); delete r.items; delete r.history; writeFileSync('reports/competitor_content/strategy-summary.json',JSON.stringify(r,null,2)); console.log(JSON.stringify(r.quality));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-content
          path: |
            reports/competitor_content/*.json
            content-evidence/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Verify coherent report snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/competitor_content')
          feed=json.loads((p/'latest.json').read_text())
          summary=json.loads((p/'strategy-summary.json').read_text())
          assert feed['checked_at_kst']==summary['source_checked_at'], 'stale analysis snapshot'
          assert len(feed['brands'])==len(summary['brands'])==feed['coverage']['target'], 'brand scope mismatch'
          assert feed['coverage']['accessible']>0, 'no observed brands'
          PY
      - name: Validate 24-brand scope, crawl frontier and snapshot quality
        run: python scripts/competitor_content/validate_snapshot.py
      - name: Publish measured content feed without rebasing generated JSON
        if: success()
        run: python scripts/competitor_publish/safe_publish.py
