name: CSK Marketing Intelligence 2.0

on:
  schedule:
    # 10:05 KST; downstream of 09:45 aggregate QA and 09:30 diagnostics.
    - cron: "5 1 * * *"
  workflow_dispatch:
  push:
    branches: [main, feat/csk-intelligence-v2-data-bridges-20261115]
    paths:
      - ".github/workflows/marketing-intelligence-v2.yml"
      - "scripts/build_marketing_intelligence_v2.py"
      - "scripts/csk_intelligence_bridges.py"
      - "scripts/build_secure_csk_signals.py"
      - "tests/test_marketing_intelligence_v2.py"
      - "tests/test_csk_intelligence_bridges.py"
      - "config/marketing_intelligence_experiments.json"
      - "config/marketing_intelligence_actions.json"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: marketing-intelligence-v2
  cancel-in-progress: true

jobs:
  intelligence-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout aggregate sources only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests
            config
            reports/daily_digest/data/daily
            reports/daily_digest/data/paid_media_spend_history.csv
            reports/pdp_opportunity
            reports/marketing_intelligence_v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safety, privacy and integration tests
        run: |
          python -m unittest discover -s tests -p 'test_marketing_intelligence_v2.py' -v
          python -m unittest discover -s tests -p 'test_csk_intelligence_bridges.py' -v
          python -m py_compile scripts/build_marketing_intelligence_v2.py scripts/csk_intelligence_bridges.py scripts/build_secure_csk_signals.py
      - name: Probe BigQuery read-only sources (private ephemeral)
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          BQ_PROJECT: ${{ vars.BQ_PROJECT || 'columbia-ga4' }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'asia-northeast3' }}
          BQ_RAW_DATASET: ${{ vars.BQ_RAW_DATASET || 'crm_raw' }}
          BQ_MART_DATASET: ${{ vars.BQ_MART_DATASET || 'crm_mart' }}
          BQ_ORDER_PRODUCT_TABLE: ${{ vars.BQ_ORDER_PRODUCT_TABLE || 'tb_order_product_search_mart' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q google-cloud-bigquery google-auth
          REPORT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')"
          python scripts/build_secure_csk_signals.py --date "$REPORT_DATE"
          test -s private_data/csk_signals/warehouse_status.json
          git check-ignore -q private_data/csk_signals/warehouse_status.json
          git check-ignore -q reports/private_aggregate_crm/segments.json
      - name: Build daily evidence-backed action board
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')"
          python scripts/build_marketing_intelligence_v2.py --date "$REPORT_DATE"
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("reports/marketing_intelligence_v2/latest.json").read_text())
          assert result["version"] == "2.0"
          assert result["status"] in {"READY", "PARTIAL", "BLOCKED"}
          assert Path("reports/marketing_intelligence_v2/index.html").stat().st_size > 1000
          assert all("user_id" not in str(x).lower() for x in result["actions"])
          print("VALIDATED:", result["report_date"], result["status"],
                "actions:", len(result["actions"]))
          PY
      - name: Publish report and persistent action state
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicitly prevent member aggregates or private source material being staged.
          rm -rf private_data/csk_signals reports/private_aggregate_crm
          git add -A reports/marketing_intelligence_v2
          if git diff --cached --name-only | grep -E '(^private_data/|^reports/private_aggregate_crm/)'; then
            echo "Security error: private files staged"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "[SKIP] Nothing new to publish"; exit 0
          fi
          git commit -m "Refresh CSK Marketing Intelligence 2.0"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "[OK] Published without email or ad-platform changes"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "[ERROR] Could not publish; do not claim success"
          exit 1
