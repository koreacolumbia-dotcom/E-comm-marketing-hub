name: Competitor Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
  push:
    paths:
      - '.github/workflows/competitor-intelligence.yml'
      - 'scripts/competitor_intelligence/**'
permissions:
  contents: write
  actions: read
concurrency:
  group: competitor-intelligence
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.51.0 aiohttp==3.11.18
      - name: Install browser without apt dependency upgrade
        run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chromium; fi
          if command -v google-chrome >/dev/null; then
            echo "CRAWLER_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Verify browser launch
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              kw = {'executable_path':os.environ['CRAWLER_CHROME']} if os.environ.get('CRAWLER_CHROME') else {}
              b=p.chromium.launch(headless=True, **kw)
              b.close()
          PY
      - name: Retrieve last successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-snapshot
          id=$(gh run list --workflow competitor-intelligence.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" -n competitor-snapshot -D previous-snapshot || echo "Previous snapshot unavailable"; fi
      - run: python -m py_compile scripts/competitor_intelligence/*.py
      - run: python scripts/competitor_intelligence/crawl.py
      - name: Generate report feed
        if: always()
        run: |
          if [ -f competitor-output/snapshot.json ]; then python scripts/competitor_intelligence/compare.py; fi
      - name: Validate 90 percent candidate coverage
        if: always()
        run: python scripts/competitor_intelligence/quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-snapshot
          path: competitor-output/*.json
          retention-days: 30
      - name: Publish compact quality status to repository
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports/competitor_intelligence
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('competitor-output/quality.json')
          d=json.loads(p.read_text()) if p.exists() else {'measurement_available':False}
          for r in d.get('brands',[]):
              for k in ('paired_discount_cards','structured_product_prices'):
                  r[k+'_count']=len(r.pop(k,[]))
          d.update(run_id=os.environ['RUN_ID'],source_sha=os.environ['SOURCE_SHA'],job_status=os.environ['JOB_STATUS'],published_at=datetime.now(timezone.utc).isoformat())
          Path('reports/competitor_intelligence/latest-quality.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/competitor_intelligence/latest-quality.json
          git commit -m "Publish competitor quality run $RUN_ID" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
