name: PDP Opportunity Build

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "PDP analysis window"
        required: true
        default: "30"
        type: choice
        options: ["7", "14", "30", "60", "90"]
  schedule:
    - cron: "40 0 * * *" # 09:40 KST daily
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdp_opportunity_build.yml'
      - 'scripts/build_ga4_today_kpi.py'
      - 'scripts/render_pdp_priority_dashboard.py'

concurrency:
  group: pdp-opportunity-build-new
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pull latest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          echo "WORKFLOW_REVISION=ga4-today-pdp-paused-manual-only"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-cloud-bigquery
          python -m py_compile scripts/build_ga4_today_kpi.py scripts/render_pdp_priority_dashboard.py
      - name: Build GA4 today KPI and PDP funnel
        shell: bash
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          BQ_PROJECT: columbia-ga4
          BQ_LOCATION: asia-northeast3
          GA4_EVENTS_TABLE: columbia-ga4.analytics_358593394.events_*
          PDP_LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
          PDP_MIN_SESSIONS: "5"
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SA_JSON_B64"
          python -u scripts/build_ga4_today_kpi.py
          python -u scripts/render_pdp_priority_dashboard.py
          test -s reports/today_kpi/data.json
          test -s reports/pdp_opportunity/data.json
          test -s reports/pdp_opportunity/meta.json
          test -s reports/pdp_opportunity/index.html
      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git add reports/today_kpi reports/pdp_opportunity
          if git diff --cached --quiet; then echo "[INFO] No changes"; exit 0; fi
          git commit -m "Refresh GA4 today KPI and PDP funnel"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
