name: Daily Intelligence Dashboard (01–18)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-intelligence-dashboard.yml'
      - 'reports/daily_intelligence/index.html'
      - 'reports/daily_intelligence/coverage.js'
      - 'scripts/personal_intelligence/build_dashboard.py'
      - 'scripts/build_problem_diagnosis.py'
      - 'tests/test_problem_diagnosis.py'
      - 'reports/decision_health/diagnosis.js'
      - 'reports/decision_health/index.html'
permissions:
  contents: write
concurrency:
  group: daily-intelligence-dashboard
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate product-first and 18-section aggregate snapshot (no BigQuery queries)
        env:
          DAILY_DIGEST_KMA_SERVICE_KEY: ${{ secrets.DAILY_DIGEST_KMA_SERVICE_KEY }}
        run: |
          python -m unittest discover -s scripts/personal_intelligence -p 'test_inventory_intelligence.py'
          python -m unittest discover -s scripts/personal_intelligence -p 'test_advanced_intelligence.py'
          test -s scripts/personal_intelligence/test_product_signal_hub.py
          python -m unittest discover -s scripts/personal_intelligence -p 'test_product_signal_hub.py' -v
          test -s scripts/personal_intelligence/test_product_timeline.py
          python -m unittest discover -s scripts/personal_intelligence -p 'test_product_timeline.py' -v
          PYTHONPATH=scripts/personal_intelligence python - <<'PY'
          from datetime import date
          from observed_weather import parse
          d=date(2026,11,17)
          raw='# TM,STN,TA_AVG,TA_MIN,TA_MAX,RN_DAY\n20261117,108,4.2,0.1,8.3,-99\n20261117,109,6,2,9,0'
          assert parse(raw,d,d)[d.isoformat()]['mean_temp']==4.2
          assert parse(raw,d,d)[d.isoformat()]['rain_mm'] is None
          assert not parse('# TM STN TA_AVG TA_MIN TA_MAX\n20261117 108 -99 -99 -99',d,d)
          print('ASOS parser fixtures passed')
          PY
          python scripts/personal_intelligence/build_dashboard.py --out reports/daily_intelligence/latest.json
      - name: Build evidence-based problem diagnosis from aggregate snapshots
        run: |
          python -m unittest discover -s tests -p 'test_problem_diagnosis.py' -v
          python scripts/build_problem_diagnosis.py
          test -s reports/decision_health/diagnoses.json
      - name: Validate navigation and aggregate output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('reports/daily_intelligence/latest.json').read_text())
          assert [s['number'] for s in x['sections']]==list(range(1,19))
          focus=x['product_focus']
          assert focus['date']==x['report_date'] and len(focus['dates'])==14
          assert all(not r['causal'] for r in focus['cards'])
          assert len(focus['temperature'])==14
          tl=focus['timeline']
          assert tl['dates']==focus['dates'] and len(tl['weather'])==14 and len(tl['weather_prior'])==14
          print('Observed weather coverage current/prior:',sum(v is not None for v in tl['weather']),sum(v is not None for v in tl['weather_prior']))
          assert all(len(r[k])==14 for r in tl['products'] for k in ('values','baseline','delta'))
          assert all(set(e['dates'])<=set(tl['dates']) for b in tl['brands'] for e in b['events'])
          assert 'id="product-focus"' in Path('reports/daily_intelligence/index.html').read_text()
          assert sum(s['status']!='validation_required' for s in x['sections'])>=10
          assert x['sections'][10]['multi_touch_status']=='private_local_only'
          inv=x['sections'][13]
          assert inv['title']=='INVENTORY INTELLIGENCE'
          assert inv['lost_sales'] is None and inv['stock_as_of'] is None
          assert all(r['stock_status']=='not_verified' and r['coverage_days'] is None for r in inv['sku_candidates'])
          nav=Path('assets/csk-unified-hub.js').read_text(encoding='utf-8')
          shell=Path('index.html').read_text(encoding='utf-8')
          intel=Path('reports/daily_intelligence/index.html').read_text(encoding='utf-8')
          assert '["daily_intelligence","18개 통합 분석",' in nav
          assert 'src="assets/csk-unified-hub.js' in shell
          assert 'id="hub-menu-root"' in shell and 'id="hub-mobile-root"' in shell
          assert 'src="./coverage.js' in intel
          assert Path('reports/daily_intelligence/coverage.js').is_file()
          cal,impact,forecast,plan=x['sections'][14:18]
          assert len(cal['days'])==37 and cal['days'][-8]['date']==x['report_date']
          assert all(r['revenue'] is None for r in cal['days'][-7:])
          if impact['reconciled']: assert abs(sum(r['accounting_delta'] for r in impact['drivers'])-impact['revenue_delta'])<0.1
          assert len(forecast['forecast'])==(7 if forecast['status']=='available' else 0)
          assert not plan['auto_execute'] and plan['expected_incremental_revenue'] is None
          print('18 sections and unified five-group PC/mobile navigation checked')
          PY
          node --version
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('reports/daily_intelligence/index.html').read_text()
          Path('/tmp/intelligence.js').write_text(re.findall(r'<script>(.*?)</script>',src,re.S)[0])
          PY
          node --check /tmp/intelligence.js
          node --check reports/daily_intelligence/timeline.js
          node --check reports/daily_intelligence/coverage.js
          node --check reports/decision_health/diagnosis.js
          python - <<'PY'
          from pathlib import Path
          import json
          diag=json.loads(Path('reports/decision_health/diagnoses.json').read_text(encoding='utf-8'))
          assert diag['schema']==1 and diag['report_date']
          assert all(p.get('causal_confirmed') is False for p in diag['problems'])
          assert 'src="./diagnosis.js' in Path('reports/decision_health/index.html').read_text(encoding='utf-8')
          print('Decision diagnosis valid; missing data preserved')
          PY
          node --check assets/dashboard-redesign.js
          grep -Fq '일일 통합 분석' reports/daily_intelligence/index.html
          grep -Fq 'ko(names[n-1])' reports/daily_intelligence/index.html
      - name: Publish only aggregate dashboard snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/daily_intelligence/latest.json reports/decision_health/diagnoses.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh daily intelligence aggregate snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
