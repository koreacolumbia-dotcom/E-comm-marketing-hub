name: CSK Winter Festival Customer Cohorts
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CSK Winter Festival Product YoY"]
    types: [completed]
  schedule:
    # 11:45 KST, after product events and admin-order sync if available
    - cron: '45 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_festival_customer_yoy.py'
      - 'tests/test_festival_customer_yoy.py'
      - '.github/workflows/csk-winter-festival-customer.yml'
permissions:
  contents: write
concurrency:
  group: csk-winter-festival-customer
  cancel-in-progress: false
jobs:
  customer-cohorts:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/build_festival_customer_yoy.py
            tests/test_festival_customer_yoy.py
            reports/decision_health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check customer first-observed purchase and aggregate-only contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_festival_customer_yoy.py
          python -m unittest discover -s tests -p 'test_festival_customer_yoy.py' -v
      - name: Install Google BigQuery client
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery
      - name: Probe admin-order history freshness and build event-year first-purchase customer cohorts
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
        run: |
          set -euo pipefail
          python scripts/build_festival_customer_yoy.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/decision_health/winter_festival_customer_yoy_2026.json')
          j=json.loads(p.read_text())
          assert j['schema']==1 and j['causal'] is False
          assert j['status'] in (
             'measured_observed_first_purchase','unavailable_source',
             'blocked_credentials','query_error')
          if j['status']=='measured_observed_first_purchase':
             a,b=j['years']['2025'],j['years']['2026']
             assert all(sum(y[c]['revenue'] for c in ('new','existing','unknown'))==y['total']['revenue'] for y in (a,b))
             assert all(sum(y[c]['orders'] for c in ('new','existing','unknown'))==y['total']['orders'] for y in (a,b))
             assert sum(j['deltas'][x]['revenue'] for x in ('new','existing','unknown'))==j['total_revenue_delta']
             assert j['query']['maximum_bytes_billed']==3*1024**3
             assert j['quality']['customer_identifiers_published'] is False
          text=str(j).lower()
          for key in ('member_id','memberid','user_pseudo_id','phone_number','transaction_id'):
             assert key not in text
          print('FESTIVAL CUSTOMER:',j['status'])
          PY
      - name: Publish only aggregated validated buyer cohorts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/decision_health/winter_festival_customer_yoy_2026.json
          if git diff --cached --quiet; then
            echo 'No new aggregate customer evidence'
            exit 0
          fi
          git commit -m 'Refresh 2025 vs 2026 Winter Festival buyer cohorts'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
