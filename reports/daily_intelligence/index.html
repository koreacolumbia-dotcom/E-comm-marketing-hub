<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CSK Daily Intelligence</title>
<style>
:root{--ink:#17334e;--navy:#142d45;--blue:#28557e;--muted:#68798b;--border:#dfe7ef;--green:#19764d;--red:#b33b42}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:14px/1.5 Arial,"Pretendard","Noto Sans KR",sans-serif}main{max-width:1440px;margin:auto;padding:24px}header{background:var(--navy);color:#fff;padding:28px;border-radius:12px}header h1{font-size:30px;letter-spacing:-1px;margin:4px 0}header small{color:#b8d0e5;letter-spacing:1.6px}.navigation{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 22px}.navigation a{padding:7px 10px;border:1px solid var(--border);background:white;color:var(--ink);font-size:12px;text-decoration:none;border-radius:5px}.section{background:white;padding:22px;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;scroll-margin-top:12px}.section h2{font-size:17px;letter-spacing:.25px;margin:0}.section h3{font-size:13px;margin:16px 0 8px}.heading{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:13px;border-bottom:1px solid var(--border);margin-bottom:12px}.status{font-size:11px;color:var(--muted);white-space:nowrap}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:12px 0}.tile{border:1px solid var(--border);padding:14px}.tile span{font-size:11px;color:var(--muted);display:block}.tile strong{font-size:25px;font-variant-numeric:tabular-nums;display:block;line-height:1.3;margin:6px 0}.tile small{font-size:12px}.positive{color:var(--green)}.negative{color:var(--red)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #e8edf2;white-space:nowrap}th{color:var(--muted);font-weight:600;background:#f5f8fb}td:not(:first-child),th:not(:first-child){text-align:right}a{color:var(--blue)}.note{font-size:12px;color:var(--muted);margin:10px 0 0}.barrow{display:grid;grid-template-columns:minmax(90px,180px) 1fr minmax(75px,105px);gap:10px;align-items:center;margin:7px 0;font-size:12px}.track{background:#eaf0f5;height:16px;border-radius:3px;overflow:hidden}.bar{height:100%;background:var(--blue)}.bar.neg{background:#bd5b61}.trend{width:100%;height:auto;display:block}.spark{width:112px;height:28px;vertical-align:middle}.local{margin:14px 0;padding:12px;border:1px dashed #a8b6c4;border-radius:6px}.local input{max-width:100%}.muted{color:var(--muted)}button{cursor:pointer;padding:7px;background:white;color:var(--ink);border:1px solid var(--border);border-radius:5px}#load{padding:16px;background:white;border:1px solid var(--border);margin-bottom:16px} @media(max-width:600px){main{padding:10px}header{padding:18px}header h1{font-size:23px}.section{padding:13px}.tile strong{font-size:21px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.navigation{gap:4px}.navigation a{font-size:10px}.barrow{grid-template-columns:95px 1fr 80px}}
</style></head><body><main><header><small>CSK ECOMMERCE · INTELLIGENCE HUB</small><h1>DAILY INTELLIGENCE</h1><div id="date">01–13 · 통합 분석</div></header><nav class="navigation" id="navigation" aria-label="Section navigation"></nav><div id="load" role="status">최신 집계 데이터를 불러오는 중입니다.</div><div id="sections"></div></main>
<script>
'use strict';
const names=['AI BUSINESS DIAGNOSIS','EXECUTIVE SUMMARY','ROOT CAUSE ANALYSIS','WEATHER INTELLIGENCE','PRODUCT INTELLIGENCE','PRODUCT EARLY WARNING','COMPETITIVE INTELLIGENCE','COMPETITIVE CONTENT','COMPETITIVE DISCOUNT MATRIX','CUSTOMER INTELLIGENCE','MARKETING ATTRIBUTION','BUDGET OPTIMIZER','SOCIAL LISTENING'];
const short=['Diagnosis','Summary','Root cause','Weather','Product','Early warning','Competition','Content','Discount','Customer','Attribution','Budget','Social'];
const statusNames={available:'집계 완료',partial:'부분 데이터',source_required:'원본 필요',validation_required:'검증 필요'};
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==null&&text!==undefined)x.textContent=String(text);if(cls)x.className=cls;return x};
const not=v=>v===null||v===undefined||!Number.isFinite(Number(v));
const fmt=(v,d=0)=>not(v)?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
const krw=v=>not(v)?'—':'₩'+fmt(v);
const pct=v=>not(v)?'—':(Number(v)>0?'+':'')+fmt(v,1)+'%';
const rate=v=>not(v)?'—':fmt(v,2)+'%';
const add=(p,...x)=>{p.append(...x);return p};
function link(label,url){let a=el('a',label);try{const href=new URL(url,location.href);if(href.protocol!=='https:'&&href.origin!==location.origin)return el('span',label);a.href=href.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return el('span',label)}}
function tile(p,label,value,sub){const x=el('div',null,'tile');add(x,el('span',label),el('strong',value));if(sub!==undefined)add(x,el('small',sub));p.append(x)}
function tiles(p,items){const x=el('div',null,'tiles');for(const item of items)tile(x,...item);p.append(x)}
function table(p,labels,rows){const wrap=el('div',null,'table-wrap'),t=el('table'),thead=el('thead'),tr=el('tr');for(const label of labels)tr.append(el('th',label));thead.append(tr);const body=el('tbody');for(const row of rows||[]){const r=el('tr');for(const v of row){const td=el('td');if(v instanceof Node)td.append(v);else td.textContent=v??'—';r.append(td)}body.append(r)}if(!rows?.length){const tr=el('tr'),td=el('td','수집 데이터 없음 / 원본 확인 필요');td.colSpan=labels.length;tr.append(td);body.append(tr)}add(t,thead,body);add(wrap,t);p.append(wrap)}
function bars(p,rows,format=krw){const max=Math.max(1,...rows.map(r=>Math.abs(Number(r[1])||0)));for(const [label,v] of rows){const x=el('div',null,'barrow'),track=el('div',null,'track'),bar=el('div',null,'bar'+(v<0?' neg':''));bar.style.width=(not(v)?0:Math.min(100,Math.abs(v)*100/max))+'%';track.append(bar);add(x,el('span',label),track,el('b',format(v)));p.append(x)}}
function spark(a,b){const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.classList.add('spark');s.setAttribute('viewBox','0 0 112 28');let n=Math.max(a?.length||0,b?.length||0),max=Math.max(1,...[...(a||[]),...(b||[])].filter(x=>!not(x)));for(const [vals,color,dash] of [[b,'#919aa3',true],[a,'#28557e',false]]){if(!vals?.length)continue;const path=document.createElementNS(ns,'path');let d='',open=false;vals.forEach((v,i)=>{if(not(v)){open=false;return}d+=(open?' L':' M')+(3+106*i/Math.max(1,n-1))+' '+(25-22*v/max);open=true});path.setAttribute('d',d);path.setAttribute('stroke',color);path.setAttribute('fill','none');path.setAttribute('stroke-width','1.5');if(dash)path.setAttribute('stroke-dasharray','3 3');s.append(path)}return s}
function note(p,text){if(text)p.append(el('p',text,'note'))}
function section(n,d){const p=el('section',null,'section');p.id='s'+String(n).padStart(2,'0');const h=el('div',null,'heading');add(h,el('h2',String(n).padStart(2,'0')+'. '+names[n-1]),el('span',statusNames[d.status]||d.status||'원본 필요','status'));p.append(h);return p}
function privateBox(p,reportDate){const box=el('div',null,'local'),input=el('input');input.type='file';input.accept='.json,application/json';const result=el('div');add(box,el('h3','PRIVATE MULTI-TOUCH ATTRIBUTION'),el('p','구매 경로 결과 JSON을 선택하면 현재 브라우저에서만 표시됩니다. 서버 전송·저장 없음. 공개 탭에는 구매 경로 데이터를 저장하지 않습니다.','note'),input,result);input.onchange=async()=>{result.replaceChildren();try{const f=input.files?.[0];if(!f||f.size>5000000)throw Error('파일 크기 오류');const obj=JSON.parse(await f.text());const m=obj.sections?.['Marketing Attribution']?.data?.multi_touch_attribution||obj;if(m.source!=='ga4_bigquery_observed_session_paths'||m.period_end!==reportDate||m.status!=='available'||!m.models)throw Error('보고일 또는 검증 상태 불일치');tiles(result,[['관측 주문',fmt(m.observed_orders)],['주문 커버리지',rate(m.order_coverage_pct)],['다중 세션 주문',fmt(m.multi_session_orders)],['매출 커버리지',rate(m.revenue_coverage_pct)]]);const models=['first_touch','last_touch','linear','position_based'];const channels=m.models.first_touch||[];table(result,['Channel','First','Last','Linear','Position'],channels.map(r=>[r.channel,...models.map(k=>krw(m.models[k]?.find(v=>v.channel===r.channel)?.revenue))]));table(result,['Path','Orders','Revenue'],(m.top_paths||[]).filter(r=>r.orders>=5).slice(0,10).map(r=>[r.path.join(' → '),fmt(r.orders),krw(r.revenue)]));note(result,'로컬 파일 · 관측 세션 기반 · 인과 효과 아님')}catch(e){note(result,'표시 실패: '+e.message)}};p.append(box)}
function render(m){const host=document.getElementById('sections');host.replaceChildren();const by=new Map((m.sections||[]).map(x=>[x.number,x]));for(let n=1;n<=13;n++){const d=by.get(n)||{},p=section(n,d);if(n===1){tiles(p,[['매출 증감',krw(d.revenue_change)]]);bars(p,(d.drivers||[]).map(x=>[x.label,x.observed_revenue_contribution]));for(const a of d.actions||[])note(p,a.priority+' · '+a.check)}
if(n===2){tiles(p,(d.cards||[]).map(x=>[x.metric.toUpperCase(),x.metric==='cvr'?rate(x.current==null?null:x.current*100):['revenue','aov'].includes(x.metric)?krw(x.current):fmt(x.current), 'YoY '+(x.delta_unit==='pp'?fmt(x.yoy,2)+'%p':pct(x.yoy))+' / WoW '+(x.delta_unit==='pp'?fmt(x.wow,2)+'%p':pct(x.wow))]))}
if(n===3){tiles(p,[['Revenue delta',krw(d.delta)],['Bridge validation',d.reconciled?'PASS':'REVIEW']]);bars(p,Object.entries(d.effects||{}));table(p,['Channel','Revenue','YoY','Delta (est.)'],(d.channels||[]).map(x=>[x.channel,krw(x.current),pct(x.revenue_yoy_pct),krw(x.delta_estimate)]))}
if(n===4){table(p,['Forecast date','Min °C','Max °C','Rain %'],(d.forecast||[]).map(x=>[x.date,fmt(x.min_temp,1),fmt(x.max_temp,1),fmt(x.pop??x.precipitation_probability)]));table(p,['Metric','30D trend'],[['Revenue',spark(d.revenue)],['Sessions',spark(d.sessions)],['Observed temp.',spark(d.temperature)]]);note(p,(d.missing||[]).join(' / '))}
if(n===5){table(p,['Category','PDP D1','YoY','7D YoY','CY / LY'],(d.categories||[]).map(x=>[x.itemCategory,fmt(x.views_d1),pct(x.day_yoy_pct),pct(x.week_yoy_pct),spark(x.ys,x.has_yoy?x.ys_yoy:null)]));table(p,['Best seller (SKU)','Qty','PDP','Revenue'],(d.best_sellers||[]).map(x=>[x.itemName||x.itemId,fmt(x.qty),fmt(x.views),krw(x.revenue)]))}
if(n===6){note(p,d.style_status);table(p,['SKU sample','Change','Qty delta','CY / LY'],(d.rising||[]).map(x=>[x.name,pct(x.daily_change_pct),fmt(x.delta_units),spark(x.series,x.prior_series)]));table(p,['PDP decline category','Views','YoY'],(d.declines||[]).map(x=>[x.itemCategory,fmt(x.views_d1),pct(x.day_yoy_pct)]))}
if(n===7){note(p,'Checked: '+(d.checked_at||'—')+' / Calendar: '+(d.calendar_date||'—'));table(p,['Brand','Status','Pages','Active events','Observed'],(d.brands||[]).map(x=>[x.brand,x.status,fmt(x.pages_checked),fmt(x.active_count),fmt(x.observed_count)]));table(p,['Event','Brand','Start','End','Date quality'],(d.events||[]).map(x=>[x.source_url||x.url?link(x.title,x.source_url||x.url):x.title,x.brand_name,x.start_date,x.end_date,x.date_status]));p.append(link('경쟁사 세일 캘린더 전체 보기','../competitor_sale_calendar/index.html'))}
if(n===8){note(p,'Checked: '+(d.checked_at||'—'));table(p,['Brand','Status','Candidates','Discovered 30D','Published 30D'],(d.brands||[]).map(x=>[x.brand,x.status,fmt(x.candidate_count),fmt(x.discovered_30d),fmt(x.published_30d)]));p.append(link('콘텐츠 상세 · TPO · 원문','../competitor_content/index.html'))}
if(n===9){tiles(p,[['Price pair coverage',fmt(d.with_pairs)+' / '+fmt(d.brand_count)],['Candidate styles',fmt(d.styles_count)]]);table(p,['Brand','Styles','Price pairs','Median discount','Status'],(d.brands||[]).map(x=>[x.brand,fmt(x.style_count),fmt(x.paired_cards),rate(x.sample_discount_median_pct),x.status]));const details=el('details'),sum=el('summary','상품별 할인 후보 상세');details.append(sum);table(details,['Brand / product','Regular','Sale','Discount'],(d.styles||[]).map(x=>[link(x.brand+' · '+x.name,x.url),krw(x.regular_price_median),krw(x.sale_price_median),rate(x.discount_pct_median)]));p.append(details)}
if(n===10){tiles(p,[['Sign-ups',fmt(d.signups),'YoY '+pct(d.signups_yoy_pct)],['Observed buyers',fmt(d.observed_buyers)],['New buyers',fmt(d.new_buyers),rate(d.new_mix_pct)],['Existing buyers',fmt(d.existing_buyers),rate(d.existing_mix_pct)]]);table(p,['Channel','New','Existing','New mix'],(d.channels||[]).map(x=>[x.channel,fmt(x.new_buyers),fmt(x.existing_buyers),rate(x.new_mix_pct)]))}
if(n===11){tiles(p,[['Revenue delta',krw(d.delta)],['Unallocated',krw(d.unallocated)]]);bars(p,(d.channels||[]).map(x=>[x.channel,x.revenue_share_pct]),rate);table(p,['Channel','Revenue','CVR','YoY','Delta (est.)'],(d.channels||[]).map(x=>[x.channel,krw(x.revenue),rate(x.cvr_pct),pct(x.revenue_yoy_pct),krw(x.revenue_delta)]));const details=el('details');details.append(el('summary','Paid media 상세'));table(details,['Media','Sessions','Orders','Revenue','CVR'],(d.paid||[]).map(x=>[x.channel,fmt(x.sessions),fmt(x.orders),krw(x.revenue),rate(x.cvr_pct)]));p.append(details);privateBox(p,m.report_date)}
if(n===12){note(p,'광고비 상태: '+(d.cost_status||'missing')+' / 마지막 기준일: '+(d.latest_cost_date||'—'));table(p,['Media','Orders','Revenue','CVR','Spend','ROAS','Action'],(d.media||[]).map(x=>[x.media,fmt(x.orders),krw(x.revenue),rate(x.cvr_pct),krw(x.spend),rate(x.roas_pct),x.recommendation]));note(p,'검증된 비용 없이는 예산 재배분 금지. 실제 광고 설정을 변경하지 않습니다.')}
if(n===13){const v=d.voc||{};tiles(p,[['공개 게시물 표본',fmt(d.observed)],['공식몰 리뷰',fmt(v.reviews)],['평균 평점',fmt(v.average_rating,2)],['1–2점 리뷰',fmt(v.low_rating_count)]]);table(p,['Source','Status','Matches'],(d.sources||[]).map(x=>[x.source,x.status,fmt(x.observed_matches)]));bars(p,(d.topics||[]).map(x=>[x.topic,x.mentions]),fmt);table(p,['Product','Reviews','Low rating','Size mentions'],(v.product_voc||[]).map(x=>[x.product,fmt(x.reviews),fmt(x.low_rating),fmt(x.size_mentions)]));p.append(link('커뮤니티 원문 보기','../external_signal.html'),el('span','  ·  '),link('공식몰 리뷰 VOC','../voc_crema/index.html'))}
note(p,d.note);host.append(p)}}
const nav=document.getElementById('navigation');for(let i=0;i<13;i++){const a=el('a',String(i+1).padStart(2,'0')+' '+short[i]);a.href='#s'+String(i+1).padStart(2,'0');nav.append(a)}
render({sections:[]});fetch('./latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('snapshot not ready');return r.json()}).then(m=>{if(m.schema!==1||m.sections?.length!==13)throw Error('invalid snapshot');document.getElementById('date').textContent='REPORT DATE '+m.report_date+' · 01–13 · 기존 공개 집계 원본';document.getElementById('load').textContent=m.report_date===m.target_date?'최신 기준일: '+m.report_date+' · 미수집 값은 — 로 표시':'최신 원본 지연: '+m.report_date+' (목표 '+m.target_date+')';render(m)}).catch(()=>{document.getElementById('load').textContent='최초 집계 배포 전입니다. 13개 섹션은 연결되어 있으며 최신 스냅샷이 생성되면 표시됩니다.'});
</script></body></html>
