#product-priority .focus-product-header{display:flex;align-items:center;gap:12px;min-width:0;margin:8px 0 12px}

#product-priority .compact-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#product-priority .compact-head h4{margin:0;font-size:12px;font-weight:750;letter-spacing:-.02em;color:#273653}
#product-priority .compact-count{flex:none;font-size:11px;color:#68798b;background:#edf1f8;border-radius:20px;padding:2px 8px}
#product-priority .compact-list{display:grid;gap:8px;min-width:0}
#product-priority .compact-entry{min-width:0;border:1px solid #edf0f6;border-radius:9px;padding:10px 11px;background:white}
#product-priority .compact-titleline{display:flex;align-items:center;gap:7px;min-width:0}
#product-priority .compact-brand{flex:none;font-size:10px;font-weight:750;color:#495a76;background:#f1f4fa;border-radius:5px;padding:3px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#product-priority .compact-price strong{font-size:14px;color:#222b47}

ct; retailer and official mall events retain their channel.":"공식 행사 기간과 배너 발견일을 구분합니다. 입점몰과 공식몰 행사도 별도로 구분합니다.","Discovered items are not confirmed publication dates. Open original content monitoring for TPO and details.":"발견일은 실제 게시일과 다릅니다. TPO 및 상세 내용은 원문 모니터링에서 확인하세요.","Same-card candidate prices; arithmetic checked only, not independent verification. Style-weighted sample statistics, not catalog averages. Single price and promotional claims are not discount rates.":"동일 상품 카드의 가격 후보를 산술 검증한 표본입니다. 독립 검증이나 전체 상품 평균은 아니며 단일 가격·광고 문구만으로 할인율을 산정하지 않습니다.","Period-level distinct buyer totals use the Total row, not the channel sum; a buyer may appear in several channels. GA4 user_id/pseudo identity and history since 2024 are not ERP lifetime members. New buyer means no earlier observed purchase before the period. Same-day signups and new buyers are not the same cohort. Do not derive signup conversion, repeat rate or segment revenue from these counts.":"전체 구매자는 중복 제거된 합계를 사용합니다. 채널 간 구매자가 중복될 수 있습니다. GA4 식별자 및 2024년 이후 구매 기록 기준이며 ERP 평생 회원 기준과 다릅니다. 신규 구매자는 기간 이전 관측 구매가 없는 고객입니다. 가입 전환율·재구매율·고객군 매출은 이 수치로 직접 계산하지 않습니다.","Session-attributed revenue, not causal contribution. Prior bases use raw values when supplied, otherwise estimates from positive current amounts and non-ambiguous growth rates. Zero/ambiguous bases remain unknown. Driver effects require positive sessions and orders in both periods. Channel and factor decompositions are separate. WoW is the source previous-period comparison, not DoD. No ROAS without spend evidence.":"GA4 세션 귀속 매출 기준이며 인과 효과는 아닙니다. 전년 원본이 없으면 조건을 충족한 경우에만 역산합니다. 모호한 기준값은 미확인으로 유지합니다. 요인별 분해는 양 기간 세션·주문이 양수일 때만 계산합니다. 채널별 분석과 요인별 분석은 별개이며 전주비는 전일비가 아닙니다. 광고비 근거 없이는 ROAS를 표시하지 않습니다.","GA4 session-attributed revenue; not causal ROAS or marginal return. Recommendations are optional bounded test scenarios, not platform updates.":"GA4 귀속 매출 기준이며 인과적 ROAS나 한계수익률이 아닙니다. 예산 권고는 제한된 테스트 시나리오로 실제 광고 설정을 변경하지 않습니다.","Observed cache sample only; missing source is not zero. Naver cache timestamps may be retrieval time. Source completeness and prior-period coverage are not verified. Topic labels overlap; keyword tags are not sentiment. Reviews and social posts are separate.":"수집된 표본만 집계합니다. 네이버 날짜는 수집 시각일 수 있고 전체 수집 여부 및 이전 기간 범위는 미검증입니다. 주제는 중복 분류될 수 있으며 감성 분석과 다릅니다. 리뷰와 커뮤니티 게시물은 별도 집계합니다.","Demand proxy from ranked samples, not full catalog. The absence of a name in bestselling rows does not establish zero sales. PDP values are reported sample counts; verify measurement scope before using a conversion ratio. Current stock is not historical stock. No lost-sales estimate or confirmed shortage without verified stock.":"상위 상품 표본의 수요 지표입니다. 인기 상품 목록에 없다고 판매량이 0인 것은 아닙니다. PDP 집계 범위를 검증하기 전에는 전환율을 계산하지 않습니다. 현재 재고는 과거 재고와 다르며 실재고 없이는 품절 및 매출 손실을 확정하지 않습니다.","30-day GA4 trend through report date + 7 forecast days. Competitor calendar as-of may be later than the report date. Observed banners are not verified event periods; absent logs are unknown, not zero. Only logged sends, no message/customer details.":"보고일까지 30일 실적과 향후 7일 예보입니다. 경쟁사 캘린더 수집일은 보고일보다 늦을 수 있습니다. 배너 발견일은 공식 행사 기간이 아니며 발송 기록 누락은 0건이 아닙니다. 메시지·고객 상세정보는 포함하지 않습니다.","Shapley accounting bridge partitions observed YoY revenue change into traffic, CVR and AOV. Logged-event overlap is descriptive, not attribution. Do not add channel or calendar effects to the accounting bridge.":"전년 대비 매출 증감을 트래픽·전환율·객단가 기여액으로 분해합니다. 발송일 실적은 관측 비교이며 인과 기여도가 아닙니다. 채널·캘린더 효과를 이 합계에 더하지 않습니다.","Evidence-driven rule-based daily decision support, not generative causal recommendations. Suggested role owners; human approval required; no ads, budget or pricing changes.":"관측 근거와 규칙에 따른 일일 의사결정 지원입니다. 담당 부서는 제안이며 담당자 검토가 필요합니다. 광고·예산·가격은 자동으로 변경하지 않습니다."};
function ko(v){if(typeof v!=='string')return v;const exact=Object.prototype.hasOwnProperty.call(KO,v)?KO[v]:null;if(exact!==null)return exact;let s=v;if(s.startsWith('Investigate ')&&s.endsWith(' revenue decline: traffic, CVR, AOV and campaign mix'))return s.slice(12,-' revenue decline: traffic, CVR, AOV and campaign mix'.length)+' 매출 하락 점검: 유입·전환율·객단가·캠페인 구성';s=s.replace(': Verify taxonomy and source reconciliation',': 분류 체계 및 원본 정합성 확인').replace(': Compare PDP-to-cart and purchase funnel',': PDP→장바구니 및 구매 퍼널 비교').replace('YoY accounting contribution: KRW ','전년비 매출 기여액: ₩').replace('Seven-day GA4 attributable revenue baseline, no campaign/weather uplift or causal forecast. Requires at least 56 contiguous reconciled daily trend days; tuning and final holdout are separate.','GA4 귀속 매출 기반 7일 예측입니다. 캠페인·날씨의 순증 효과는 반영하지 않으며, 정합성이 확인된 연속 56일 이상 실적이 필요합니다. 모델 선택과 최종 검증 기간은 분리합니다.').replace(' Holdout gate failed (WAPE ≤35%, no worse than seasonal naive, empirical band coverage ≥70%); forecast withheld.',' 검증 기준 미충족(오차율 35% 이하, 전주 동요일 모델 이상, 경험적 구간 포함률 70% 이상)으로 예측을 표시하지 않습니다.').replace(' Band uses tuning absolute error 80th percentile; not a guaranteed probability or an independent prediction interval. Only 14 holdout days.',' 오차 구간은 모델 선택 기간의 절대오차 80백분위 기준이며 확률 보장 구간이 아닙니다. 최종 검증은 14일입니다.');return s;}

const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==null&&text!==undefined)x.textContent=String(ko(text));if(cls)x.className=cls;return x};
const not=v=>v===null||v===undefined||!Number.isFinite(Number(v));
const fmt=(v,d=0)=>not(v)?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
const krw=v=>not(v)?'—':'₩'+fmt(v);
const pct=v=>not(v)?'—':(Number(v)>0?'+':'')+fmt(v,1)+'%';
const rate=v=>not(v)?'—':fmt(v,2)+'%';
const add=(p,...x)=>{p.append(...x);return p};
function link(label,url){let a=el('a',label);try{const href=new URL(url,location.href);if(href.protocol!=='https:'&&href.origin!==location.origin)return el('span',label);a.href=href.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return el('span',label)}}
function tile(p,label,value,sub){const x=el('div',null,'tile');add(x,el('span',label),el('strong',value));if(sub!==undefined)add(x,el('small',sub));p.append(x)}
function tiles(p,items){const x=el('div',null,'tiles');for(const item of items)tile(x,...item);p.append(x)}
function table(p,labels,rows){const wrap=el('div',null,'table-wrap'),t=el('table'),thead=el('thead'),tr=el('tr');for(const label of labels)tr.append(el('th',label));thead.append(tr);const body=el('tbody');for(const row of rows||[]){const r=el('tr');for(const v of row){const td=el('td');if(v instanceof Node)td.append(v);else td.textContent=ko(v??'—');r.append(td)}body.append(r)}if(!rows?.length){const tr=el('tr'),td=el('td','수집 데이터 없음 / 원본 확인 필요');td.colSpan=labels.length;tr.append(td);body.append(tr)}add(t,thead,body);add(wrap,t);p.append(wrap)}
function bars(p,rows,format=krw){const max=Math.max(1,...rows.map(r=>Math.abs(Number(r[1])||0)));for(const [label,v] of rows){const x=el('div',null,'barrow'),track=el('div',null,'track'),bar=el('div',null,'bar'+(v<0?' neg':''));bar.style.width=(not(v)?0:Math.min(100,Math.abs(v)*100/max))+'%';track.append(bar);add(x,el('span',label),track,el('b',format(v)));p.append(x)}}

function compactDate(s){return s?String(s).slice(5).replace('-','.'):''}
function compactEvidenceItem(v,kind){
 const row=el('article',null,'compact-entry'),top=el('div',null,'compact-titleline');
 const brand=el('span',v.brand||'브랜드 미확인','compact-brand');

 title.classList.add('compact-link');add(top,brand,title);row.append(top);
 if(kind==='event'){
   const term=v.start?(compactDate(v.start)+(v.end?'–'+compactDate(v.end):'~ 종료 미확인')):'실제 기간 미확인';
   const level=v.date_status==='official_period'?'공식 기간':v.date_status==='observed_only'?'배너 관측':ko(v.date_status||'검증 상태 미확인');

   row.append(el('div',level+' · '+term+' · '+overlap,'compact-entry-meta'));
