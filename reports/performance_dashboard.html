<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance Dashboard</title>
<style>
:root{--bg:#070b14;--panel:#0d1422;--panel2:#111a2b;--line:#243044;--text:#eef4ff;--muted:#91a0b8;--accent:#4f8cff;--ly:#9aa8bc}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,'Noto Sans KR',sans-serif}body{min-height:100vh;overflow:visible!important}.wrap{max-width:1500px;margin:auto;padding:28px}h1{margin:0 0 4px;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted)}select,input,button{background:#0a1120;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px}button{cursor:pointer}button.active{border-color:var(--accent)}.preset{display:flex;gap:6px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px}.k{color:var(--muted);font-size:12px}.v{font-size:25px;font-weight:800;margin-top:8px}.yoy{font-size:12px;margin-top:5px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}.head h2{font-size:16px;margin:2px 0 0;overflow-wrap:anywhere}.rank{color:var(--muted);font-size:11px}.mini{color:var(--muted);font-size:12px;text-align:right}.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:10px}.stats b{color:var(--text);margin-left:4px}.stats em{font-style:normal;margin-left:4px;color:var(--muted)}.chartbox{height:260px;width:100%;overflow:hidden;border-radius:10px;background:#09111f}.trend-svg{display:block;width:100%;height:100%}.trend-grid{stroke:#1c2b43;stroke-width:1}.trend-axis,.trend-date,.trend-legend{fill:#91a0b8;font-size:10px}.trend-ty{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.trend-ly{fill:none;stroke:var(--ly);stroke-width:2;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.empty{padding:30px;text-align:center;color:var(--muted)}.note{color:var(--muted);font-size:11px;margin-top:16px}.legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:10px;margin:0 0 8px 48px}.dot{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:5px;background:var(--accent)}.dot.ly{background:repeating-linear-gradient(90deg,var(--ly) 0 5px,transparent 5px 9px)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.wrap{padding:16px}.chartbox{height:240px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Performance Dashboard</h1>
<div class="sub">GA4 BigQuery only · 최대 최근 6개월 · 선택 기간 Revenue 기준 Top 10 Source / Medium · LY 동기간 비교</div>
<div class="toolbar">
  <div class="field"><label>빠른 기간</label><div class="preset"><button data-days="31" class="active">최근 31일</button><button data-months="3">최근 3개월</button><button data-months="6">최근 6개월</button></div></div>
  <div class="field"><label>시작일</label><input id="startDate" type="date" min="2026-03-11" max="2026-09-10" value="2026-08-11"></div>
  <div class="field"><label>종료일</label><input id="endDate" type="date" min="2026-03-11" max="2026-09-10" value="2026-09-10"></div>
  <div class="field"><label>지표</label><select id="metric"><option value="revenue">Revenue</option><option value="sessions">Sessions</option><option value="purchases">Purchases</option></select></div>
  <button id="applyBtn">적용</button>
</div>
<div id="periodText" class="sub"></div>
<div class="cards">
  <div class="card"><div class="k">Revenue</div><div class="v" id="totalRevenue">-</div><div class="yoy" id="revYoy">-</div></div>
  <div class="card"><div class="k">Sessions</div><div class="v" id="totalSessions">-</div><div class="yoy" id="sesYoy">-</div></div>
  <div class="card"><div class="k">Purchases</div><div class="v" id="totalPurchases">-</div><div class="yoy" id="purYoy">-</div></div>
  <div class="card"><div class="k">CVR</div><div class="v" id="totalCvr">-</div><div class="yoy" id="cvrYoy">-</div></div>
</div>
<div id="grid" class="grid"><div class="panel empty">최근 31일 데이터 불러오는 중...</div></div>
<div class="note">(not set) Source 또는 Medium은 제외. Top 10은 선택 기간 Revenue 기준이며, 파란 실선은 TY / 회색 점선은 LY입니다.</div>
</div>
<script>
let TY=[],LY=[];
const MIN_DATE='2026-03-11',MAX_DATE='2026-09-10',RECENT_START='2026-08-11';
let scope='recent',fullPromise=null,renderToken=0;
const $=id=>document.getElementById(id);
const fmtN=v=>Math.round(Number(v)||0).toLocaleString();
const fmtK=v=>'₩'+Math.round(Number(v)||0).toLocaleString();
const pct=(a,b)=>b?((a/b-1)*100):null;
const pctText=v=>v==null?'YoY -':`YoY ${v>=0?'+':''}${v.toFixed(1)}%`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(s,n)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const inRange=(r,s,e)=>r.date>=s&&r.date<=e;
function aggregate(rows){return rows.reduce((a,r)=>{a.sessions+=Number(r.sessions)||0;a.purchases+=Number(r.purchases)||0;a.revenue+=Number(r.revenue)||0;return a},{sessions:0,purchases:0,revenue:0})}
function bySm(rows){const m=new Map();for(const r of rows){let x=m.get(r.sm);if(!x){x={sessions:0,purchases:0,revenue:0};m.set(r.sm,x)}x.sessions+=Number(r.sessions)||0;x.purchases+=Number(r.purchases)||0;x.revenue+=Number(r.revenue)||0}return m}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function compact(v){return Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1}).format(Number(v)||0)}
function buildDailyIndex(rows){const root=new Map();for(const r of rows){let m=root.get(r.sm);if(!m){m=new Map();root.set(r.sm,m)}m.set(r.date,{sessions:Number(r.sessions)||0,purchases:Number(r.purchases)||0,revenue:Number(r.revenue)||0})}return root}
let tyIndex=new Map(),lyIndex=new Map();
function rebuildIndexes(){tyIndex=buildDailyIndex(TY);lyIndex=buildDailyIndex(LY)}
function series(index,sm,metric,s,e){const m=index.get(sm),out=[];for(let d=s;d<=e;d=addDays(d,1))out.push(m?.get(d)?.[metric]||0);return out}
function pathFor(arr,W,H,L,R,T,B,max){const pw=W-L-R,ph=H-T-B,n=Math.max(arr.length,1);let p='';for(let i=0;i<arr.length;i++){const x=L+(n<=1?0:(i/(n-1))*pw),y=T+ph-(Math.max(0,arr[i])/max)*ph;p+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1)}return p}
function svgChart(ty,ly,metric,s,e){
  const W=760,H=260,L=58,R=16,T=18,B=34,max=Math.max(1,...ty,...ly),ph=H-T-B;
  const grid=[0,.25,.5,.75,1].map(fr=>{const y=T+ph-ph*fr,val=max*fr;return `<line class="trend-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="trend-axis" x="${L-7}" y="${y+3}" text-anchor="end">${metric==='revenue'?'₩':''}${compact(val)}</text>`}).join('');
  const mid=addDays(s,Math.floor((new Date(e)-new Date(s))/86400000/2));
  return `<div class="legend"><span><i class="dot"></i>TY</span><span><i class="dot ly"></i>LY</span></div><svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="TY LY 일별 추이">${grid}<path class="trend-ty" d="${pathFor(ty,W,H,L,R,T,B,max)}"/><path class="trend-ly" d="${pathFor(ly,W,H,L,R,T,B,max)}"/><text class="trend-date" x="${L}" y="${H-9}" text-anchor="start">${s.slice(5)}</text><text class="trend-date" x="${W/2}" y="${H-9}" text-anchor="middle">${mid.slice(5)}</text><text class="trend-date" x="${W-R}" y="${H-9}" text-anchor="end">${e.slice(5)}</text></svg>`;
}
function notifyParent(){
  requestAnimationFrame(()=>{const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);try{parent.postMessage({type:'dailyDigestResize',height:h},'*')}catch(e){}});
  setTimeout(()=>{const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);try{parent.postMessage({type:'dailyDigestResize',height:h},'*')}catch(e){}},120);
}
async function fetchPayload(stem){const r=await fetch(stem+'.json?v=202609111807',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function applyPayload(d,nextScope){TY=Array.isArray(d.ty)?d.ty:[];LY=Array.isArray(d.ly)?d.ly:[];scope=nextScope;rebuildIndexes()}
function ensureFull(){if(scope==='full')return Promise.resolve();if(!fullPromise)fullPromise=fetchPayload('performance_data').then(d=>applyPayload(d,'full')).catch(e=>{fullPromise=null;throw e});return fullPromise}
async function render(){
  const token=++renderToken,s=$('startDate').value,e=$('endDate').value,metric=$('metric').value;
  if(!s||!e||s>e||s<MIN_DATE||e>MAX_DATE){alert(`기간은 ${MIN_DATE} ~ ${MAX_DATE} 사이로 선택해줘.`);return}
  if(scope!=='full'&&s<RECENT_START){$('grid').innerHTML='<div class="panel empty">6개월 데이터 불러오는 중...</div>';notifyParent();try{await ensureFull()}catch(err){$('grid').innerHTML='<div class="panel empty">전체 데이터 로딩 실패 · 새로고침 후 다시 시도해주세요.</div>';notifyParent();return}if(token!==renderToken)return}
  const ty=TY.filter(r=>inRange(r,s,e)),ly=LY.filter(r=>inRange(r,s,e));
  const t=aggregate(ty),l=aggregate(ly),tcvr=t.sessions?t.purchases/t.sessions:0,lcvr=l.sessions?l.purchases/l.sessions:0;
  $('totalRevenue').textContent=fmtK(t.revenue);$('totalSessions').textContent=fmtN(t.sessions);$('totalPurchases').textContent=fmtN(t.purchases);$('totalCvr').textContent=(tcvr*100).toFixed(2)+'%';
  $('revYoy').textContent=pctText(pct(t.revenue,l.revenue));$('sesYoy').textContent=pctText(pct(t.sessions,l.sessions));$('purYoy').textContent=pctText(pct(t.purchases,l.purchases));$('cvrYoy').textContent=`YoY ${((tcvr-lcvr)*100)>=0?'+':''}${((tcvr-lcvr)*100).toFixed(2)}pp`;$('periodText').textContent=`선택 기간: ${s} ~ ${e} · 전년 동일기간 비교`;
  const tm=bySm(ty),lm=bySm(ly),top=[...tm.entries()].sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,10),grid=$('grid');grid.innerHTML='';
  if(!top.length){grid.innerHTML='<div class="panel empty">선택 기간에 데이터가 없습니다.</div>';notifyParent();return}
  const frag=document.createDocumentFragment();
  for(const [i,[sm,a]] of top.entries()){
    const b=lm.get(sm)||{sessions:0,purchases:0,revenue:0},cvr=a.sessions?a.purchases/a.sessions:0,cvrLy=b.sessions?b.purchases/b.sessions:0,tyD=series(tyIndex,sm,metric,s,e),lyD=series(lyIndex,sm,metric,s,e);
    const sec=document.createElement('section');sec.className='panel source-panel';sec.innerHTML=`<div class="head"><div><div class="rank">#${i+1}</div><h2>${esc(sm)}</h2></div><div class="mini">Revenue ${fmtK(a.revenue)} · ${pctText(pct(a.revenue,b.revenue))}</div></div><div class="stats"><span>Sessions <b>${fmtN(a.sessions)}</b> <em>${pctText(pct(a.sessions,b.sessions)).replace('YoY ','')}</em></span><span>Purchases <b>${fmtN(a.purchases)}</b> <em>${pctText(pct(a.purchases,b.purchases)).replace('YoY ','')}</em></span><span>CVR <b>${(cvr*100).toFixed(2)}%</b> <em>${((cvr-cvrLy)*100)>=0?'+':''}${((cvr-cvrLy)*100).toFixed(2)}pp</em></span></div><div class="chartbox">${svgChart(tyD,lyD,metric,s,e)}</div>`;frag.appendChild(sec)
  }
  grid.appendChild(frag);notifyParent();
}
document.querySelectorAll('.preset button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.preset button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const e=MAX_DATE;let s=btn.dataset.days?addDays(e,-(Number(btn.dataset.days)-1)):addDays(addMonths(e,-Number(btn.dataset.months)),1);if(s<MIN_DATE)s=MIN_DATE;$('startDate').value=s;$('endDate').value=e;render()}));
$('applyBtn').addEventListener('click',()=>{document.querySelectorAll('.preset button').forEach(x=>x.classList.remove('active'));render()});$('metric').addEventListener('change',render);
(async()=>{try{applyPayload(await fetchPayload('performance_data_recent'),'recent');await render()}catch(err){console.error(err);$('grid').innerHTML='<div class="panel empty">데이터 로딩 실패 · 새로고침 후 다시 시도해주세요.</div>';notifyParent()}})();
</script>
</body>
</html>
