<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Realtime Alert Center</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#142033;--muted:#718096;--line:#e7edf5;--red:#dc2626;--amber:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:1200px;margin:auto;padding:16px}h1{font-size:25px;margin:0}.sub{font-size:11px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.value{font-size:22px;font-weight:800}.alert{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.level{font-size:9px;font-weight:800}.critical{color:var(--red)}.warning{color:var(--amber)}@media(max-width:700px){main{padding:9px}.kpis{grid-template-columns:repeat(2,1fr);gap:6px}.card{padding:10px;border-radius:11px}.value{font-size:18px}h1{font-size:21px}}</style></head><body><main><h1>Realtime Alert Center</h1><div class="sub" id="meta"></div><section class="kpis" id="kpis"></section><section class="card" id="alerts"></section></main><script>const D={"generated_at": "2026-07-18T08:06:10.774122+09:00", "observed_hour": "2026-07-18T07:00:00+09:00", "status": "healthy", "alert_count": 0, "critical_count": 0, "warning_count": 0, "current_overall": {"hour_kst": "2026-07-18 07:00:00", "dimension_type": "overall", "dimension_value": "all", "sessions": 122, "users": 122, "page_view_events": 628, "view_item_events": 270, "add_to_cart_events": 7, "checkout_events": 8, "purchase_events": 2, "orders": 2, "revenue": 207580.0, "signups": 0, "event_count": 1038, "purchase_without_id": 0, "zero_revenue_purchase": 0, "duplicate_purchase_events": 0, "latest_event_ts": "2026-07-17 22:59:54.444056+00:00"}, "monitored_dimensions": 578, "alerts": []};document.querySelector('#meta').textContent='관측 '+D.observed_hour+' · 생성 '+D.generated_at;document.querySelector('#kpis').innerHTML=[['상태',D.status.toUpperCase()],['전체',D.alert_count],['Critical',D.critical_count],['Warning',D.warning_count],['감시 대상',D.monitored_dimensions]].map(x=>'<div class="card"><div class="sub">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');document.querySelector('#alerts').innerHTML=D.alerts.map(a=>'<div class="alert"><span class="level '+a.level+'">'+a.level.toUpperCase()+'</span><div><b>'+a.title+'</b><div class="sub">'+a.impact+'<br>'+a.cause+'<br>Action: '+a.action+'</div></div></div>').join('')||'<p>현재 활성 이상 징후가 없습니다.</p>';</script></body></html>
