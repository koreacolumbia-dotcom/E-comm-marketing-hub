<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Marketing Hub v2</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="../../assets/dashboard_redesign.css"><style>
:root{color-scheme:light}.dark{color-scheme:dark;--csk-bg:#0b1220;--csk-card:#111a2b;--csk-text:#e8eef9;--csk-muted:#93a4bd;--csk-line:#22304a}.v2{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:11px;color:#0874e8;font-weight:800;letter-spacing:.13em}.top h1{margin:6px 0;font-size:34px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--csk-line);background:var(--csk-card);padding:10px 13px;border-radius:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:var(--csk-card);border:1px solid var(--csk-line);border-radius:18px;padding:20px;box-shadow:var(--csk-shadow)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.metric{font-size:30px;font-weight:800;letter-spacing:-.05em}.sub{font-size:12px;color:var(--csk-muted)}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.effect{padding:13px;background:var(--csk-bg);border-radius:13px}.alert{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--csk-line)}.level{font-size:11px;font-weight:800}.critical,.high{color:#dc2626}.medium{color:#d97706}.info{color:#0874e8}.opp{display:grid;grid-template-columns:48px minmax(180px,1fr) repeat(4,minmax(90px,.5fr));gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--csk-line)}.score{width:42px;height:42px;border-radius:12px;background:#eaf4ff;color:#0874e8;display:grid;place-items:center;font-weight:800}.palette{position:fixed;inset:0;background:rgba(5,12,24,.5);display:none;place-items:start center;padding-top:12vh;z-index:99}.palette.open{display:grid}.palette-box{width:min(620px,92vw);background:var(--csk-card);border-radius:18px;padding:14px}.palette input{width:100%;padding:13px}.palette a{display:block;padding:12px;border-radius:10px;color:inherit;text-decoration:none}.palette a:hover{background:var(--csk-bg)}@media(max-width:850px){.v2{padding:16px 14px 90px}.top{align-items:flex-start}.top h1{font-size:27px}.span8,.span6,.span4{grid-column:span 12}.effects{grid-template-columns:1fr}.opp{grid-template-columns:44px 1fr}.opp>*:nth-child(n+3){display:none}.alert{grid-template-columns:70px 1fr}.alert a{display:none}}
</style></head><body><main class="v2"><header class="top"><div><div class="eyebrow">E-COMMERCE MARKETING HUB V2</div><h1>Decision Intelligence</h1><div class="sub" id="updated"></div></div><div class="tools"><button class="btn" id="cmd">⌘ K</button><button class="btn" id="theme">◐</button></div></header><section class="grid"><article class="card span8"><h2>Executive Brief 2.0</h2><div id="brief"></div></article><article class="card span4"><h2>Target & Forecast</h2><div id="forecast"></div></article><article class="card span6"><h2>매출 변화 원인 분해</h2><div id="decomp"></div></article><article class="card span6" id="media"><h2>Paid Media 통합</h2><div id="ads"></div></article><article class="card span12"><h2>Alert Center</h2><div id="alerts"></div></article><article class="card span12" id="opportunity"><h2>PDP Opportunity Center</h2><div class="sub">상품을 클릭하면 기존 상품 리포트로 연결됩니다.</div><div id="opps"></div></article></section></main><div class="palette" id="palette"><div class="palette-box"><input id="search" placeholder="메뉴 또는 기능 검색"><div id="commands"></div></div></div><script>const D={"generated_at": "2026-07-17 00:53 KST", "decomposition": {"ready": false, "message": "현재 Summary JSON에 전기 매출·세션·주문 값이 없어 자동 분해를 대기 중입니다."}, "forecast": {"ready": true, "current": 3993971997.0, "elapsed_days": 17, "days": 31, "predicted": 7283125406.294117, "daily_pace": 234939529.2352941, "target": null}, "opportunities": [], "ads": {"connected": false}, "alerts": [{"level": "critical", "title": "purchase_pattern 데이터 지연", "impact": "기준일 2026-06-02", "cause": "원천 적재 또는 리포트 생성 작업 확인", "link": "../index.html"}, {"level": "critical", "title": "funnel 데이터 누락", "impact": "기준일 확인 불가", "cause": "원천 적재 또는 리포트 생성 작업 확인", "link": "../index.html"}, {"level": "critical", "title": "member 데이터 누락", "impact": "기준일 확인 불가", "cause": "원천 적재 또는 리포트 생성 작업 확인", "link": "../index.html"}, {"level": "critical", "title": "ai_agent 데이터 누락", "impact": "기준일 확인 불가", "cause": "원천 적재 또는 리포트 생성 작업 확인", "link": "../index.html"}, {"level": "info", "title": "광고비 데이터 미연결", "impact": "ROAS·CAC 통합 분석 대기", "cause": "광고 플랫폼 집계 파일 또는 BigQuery View 설정 필요", "link": "#media"}]};const won=n=>n==null?'-':new Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1}).format(n)+'원';const pct=n=>n==null?'-':Number(n).toFixed(1)+'%';document.querySelector('#updated').textContent='Updated '+D.generated_at;let brief=[];if(D.alerts.filter(x=>['critical','high'].includes(x.level)).length)brief.push('핵심 경고 '+D.alerts.filter(x=>['critical','high'].includes(x.level)).length+'건이 있습니다.');else brief.push('핵심 운영 지표는 설정된 경고 범위 안에 있습니다.');if(D.decomposition.ready){const e=[...D.decomposition.effects].sort((a,b)=>Math.abs(b.value)-Math.abs(a.value))[0];brief.push('매출 변화의 가장 큰 기여 요인은 '+e.name+'이며 영향액은 '+won(e.value)+'입니다.')}if(D.forecast.ready)brief.push('현재 페이스 기준 월말 예상 매출은 '+won(D.forecast.predicted)+'입니다.');if(D.opportunities.length)brief.push('PDP 최우선 개선 상품은 '+D.opportunities[0].name+'입니다.');document.querySelector('#brief').innerHTML=brief.map(x=>'<p>• '+x+'</p>').join('');const F=D.forecast;document.querySelector('#forecast').innerHTML=F.ready?'<div class="metric">'+won(F.predicted)+'</div><div class="sub">월말 예상</div><p>현재 '+won(F.current)+'</p>'+(F.target?'<p>목표 '+won(F.target)+' · 예상 달성률 '+pct(F.forecast_attainment)+'</p><p>필요 일평균 '+won(F.required_daily)+'</p>':'<p class="sub">config/dashboard_v2.json에 월 목표를 설정하세요.</p>'):'<p>'+F.message+'</p>';const C=D.decomposition;document.querySelector('#decomp').innerHTML=C.ready?'<div class="metric">'+won(C.change)+'</div><div class="effects">'+C.effects.map(x=>'<div class="effect"><b>'+x.name+'</b><div>'+won(x.value)+'</div></div>').join('')+'</div>':'<p>'+C.message+'</p>';document.querySelector('#ads').innerHTML=D.ads.connected?'<div class="metric">'+pct(D.ads.roas)+'</div><div class="sub">통합 ROAS</div>':'<p>광고비 집계 데이터가 아직 연결되지 않았습니다.</p><div class="sub">Google·Meta·Naver·Kakao 집계 View를 연결하면 Spend, ROAS, CAC가 표시됩니다.</div>';document.querySelector('#alerts').innerHTML=D.alerts.map(x=>'<div class="alert"><span class="level '+x.level+'">'+x.level.toUpperCase()+'</span><div><b>'+x.title+'</b><div class="sub">'+x.impact+' · '+x.cause+'</div></div><a href="'+x.link+'">열기</a></div>').join('')||'<p>현재 활성 경고가 없습니다.</p>';document.querySelector('#opps').innerHTML=D.opportunities.slice(0,20).map((x,i)=>'<a class="opp" href="../product_keyword/index.html"><span class="score">'+Math.round(x.score)+'</span><span><b>'+(i+1)+'. '+x.name+'</b><div class="sub">'+x.reason+'</div></span><span>'+Math.round(x.sessions).toLocaleString()+' 세션</span><span>'+pct(x.cvr)+'</span><span>'+won(x.expected_revenue)+'</span><span>'+won(x.revenue)+'</span></a>').join('')||'<p>상품 JSON 컬럼 매핑 후 우선순위가 표시됩니다.</p>';const commands=[['Summary','../index.html'],['상품 성과','../product_keyword/index.html'],['Funnel','../daily_digest/owned_funnel_tab.html'],['소스/매체','../utm_channel/index.html'],['PDP Opportunity','#opportunity'],['Alert Center','#alerts']];const pal=document.querySelector('#palette'),render=q=>document.querySelector('#commands').innerHTML=commands.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>'<a href="'+x[1]+'">'+x[0]+'</a>').join('');render('');document.querySelector('#cmd').onclick=()=>{pal.classList.add('open');document.querySelector('#search').focus()};document.querySelector('#search').oninput=e=>render(e.target.value);pal.onclick=e=>{if(e.target===pal)pal.classList.remove('open')};document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#cmd').click()}if(e.key==='Escape')pal.classList.remove('open')};document.querySelector('#theme').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('v2theme',document.documentElement.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('v2theme')==='dark')document.documentElement.classList.add('dark');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
